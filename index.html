<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Reading Master - Trọn Bộ 18 Bài Tập</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg bg-indigo-800 hover:bg-indigo-900 transition text-white">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <span class="bg-white text-indigo-700 px-2.5 py-1 rounded-md font-extrabold text-sm uppercase tracking-wide">IELTS</span>
        <div>
          <h1 class="text-base md:text-lg font-bold leading-tight line-clamp-1" id="top-title">IELTS Reading - Round 2</h1>
          <p class="text-xs text-indigo-200 hidden sm:block" id="top-subtitle">Practice today, Success tomorrow!</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 text-xs md:text-sm">
        <span id="score-badge" class="hidden bg-emerald-600 px-3 py-1.5 rounded-full font-semibold shadow">
          Điểm: <span id="score-display">0/0</span>
        </span>
        <button onclick="toggleSidebar()" class="hidden lg:flex items-center gap-1.5 bg-indigo-800/80 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-500/30 text-xs transition">
          <i class="fa-solid fa-list-ul"></i> Chọn Bài
        </button>
      </div>
    </div>
  </header>

  <!-- Container -->
  <div class="max-w-7xl mx-auto px-4 py-4 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-5 relative">
    
    <!-- Sidebar Menu 18 Bài Tập (Drawer trên mobile, sidebar trên desktop) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 lg:w-full lg:col-span-3 lg:shadow-none lg:bg-transparent flex flex-col h-[calc(100vh-80px)] lg:h-[calc(100vh-100px)] sticky top-20">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-full overflow-hidden">
        <div class="p-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center space-x-2 text-slate-800 font-bold text-sm">
            <i class="fa-solid fa-layer-group text-indigo-600"></i>
            <span>18 IELTS Activities</span>
          </div>
          <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
        <div id="activity-menu" class="flex-1 overflow-y-auto p-2 space-y-1.5 custom-scrollbar text-xs">
          <!-- Render dynamically by JS -->
        </div>
      </div>
    </aside>

    <!-- Khu vực làm bài chính (9/12 cột ở Desktop) -->
    <main class="lg:col-span-9 grid grid-cols-1 xl:grid-cols-12 gap-5">
      
      <!-- CỘT TRÁI CỦA MAIN: Bài đọc, Audio AI, Dịch (7/12 cột ở xl) -->
      <section class="xl:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5 flex flex-col h-[calc(100vh-100px)] sticky top-20">
        <!-- Toolbar -->
        <div class="pb-3 mb-3 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2 bg-slate-50/80 p-2.5 rounded-xl border border-slate-200/60">
          <div class="flex items-center space-x-1.5">
            <button id="btn-audio-play" onclick="toggleAudio()" class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
              <i id="audio-icon" class="fa-solid fa-play"></i>
              <span id="audio-text">Audio AI</span>
            </button>
            <div class="flex items-center space-x-1 bg-white px-2 py-1 rounded-lg border border-slate-200 text-xs">
              <i class="fa-solid fa-gauge-high text-slate-400 text-[10px]"></i>
              <select id="audio-rate" class="bg-transparent font-medium text-slate-700 text-xs focus:outline-none">
                <option value="0.8">0.8x</option>
                <option value="1" selected>1.0x</option>
                <option value="1.2">1.2x</option>
              </select>
            </div>
          </div>
          <button onclick="toggleTranslation()" class="px-2.5 py-1.5 bg-white border border-indigo-200 text-indigo-700 hover:bg-indigo-50 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-language text-indigo-600"></i>
            <span id="trans-btn-text">Xem Bản Dịch</span>
          </button>
        </div>

        <!-- Nội dung Passage -->
        <div id="passage-container" class="overflow-y-auto pr-2 custom-scrollbar space-y-4 text-slate-700 text-sm leading-relaxed">
          <!-- Render dynamically by JS -->
        </div>
      </section>

      <!-- CỘT PHẢI CỦA MAIN: Tabs Quiz & Từ Vựng (5/12 cột ở xl) -->
      <section class="xl:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[calc(100vh-100px)] sticky top-20 overflow-hidden">
        <!-- Tab Headers -->
        <div class="flex border-b border-slate-200 bg-slate-50">
          <button id="tab-btn-quiz" onclick="switchTab('quiz')" class="flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-indigo-600 text-indigo-700 flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-list-check"></i> Câu Hỏi & Bài Làm
          </button>
          <button id="tab-btn-vocab" onclick="switchTab('vocab')" class="flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-book-bookmark"></i> Từ Vựng / Phân Tích
          </button>
        </div>

        <!-- Tab 1: Quiz Form -->
        <div id="tab-quiz" class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-4">
          <div id="quiz-instruction" class="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-lg text-xs text-amber-900 leading-snug">
            <!-- Instruction text -->
          </div>
          <form id="reading-quiz" onsubmit="submitQuiz(event)" class="space-y-4">
            <div id="questions-list" class="space-y-4">
              <!-- Render dynamically by JS -->
            </div>
            <div class="flex items-center gap-2 pt-2">
              <button type="submit" class="flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition text-xs flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Nộp Bài & Xem Giải Thích
              </button>
              <button type="button" onclick="resetCurrentQuiz()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition">
                <i class="fa-solid fa-rotate-right"></i>
              </button>
            </div>
          </form>
        </div>

        <!-- Tab 2: Vocab & Paraphrase -->
        <div id="tab-vocab" class="hidden flex-1 overflow-y-auto p-4 custom-scrollbar space-y-5">
          <div id="vocab-content" class="space-y-3">
            <!-- Render dynamically by JS -->
          </div>
          <div id="para-content" class="space-y-3 pt-3 border-t border-slate-200">
            <!-- Render dynamically by JS -->
          </div>
        </div>

      </section>

    </main>

  </div>

  <!-- SCRIPT DATA & APP LOGIC -->
  <script>
    // TOÀN BỘ 18 BÀI TẬP VÀ ĐÁP ÁN CHUẨN TỪ EBOOK IELTS READING ROUND 2
    const ACTIVITIES = [
      {
        id: 1,
        part: "01. SENTENCE COMPLETION",
        title: "Activity 1: AMAZING HOMES",
        instruction: "Complete the sentences. Choose NO MORE THAN TWO WORDS from the passage for each answer.",
        passage: [
          { en: "Most people live in a house or a flat. When they go on holiday they stay in a hotel or a guest house. But some places where you can live or stay are a bit different.", vi: "Hầu hết mọi người sống trong một ngôi nhà hoặc căn hộ. Khi đi nghỉ, họ thường ở khách sạn hoặc nhà nghỉ. Nhưng một số nơi mà bạn có thể sinh sống hoặc lưu trú lại có phần khác biệt." },
          { en: "A. One unusual place to live is a houseboat. Amsterdam in Holland is famous for its houseboats - there are about 2,500 of them. They have everything that normal houses have: a living room, bedroom, kitchen, bathroom and even sometimes a terrace on the roof. They are cheaper than houses and people who live on houseboats enjoy being close to nature. Some houseboats can be moved to other parts of the river, while others are permanently in one place.", vi: "A. Một nơi ở khác thường là nhà thuyền. Amsterdam ở Hà Lan nổi tiếng với những ngôi nhà thuyền – có khoảng 2.500 ngôi nhà như vậy. Chúng có mọi thứ mà những ngôi nhà bình thường có: phòng khách, phòng ngủ, nhà bếp, phòng tắm và đôi khi thậm chí còn có cả sân thượng trên mái..." },
          { en: "B. In Tokyo, Japan, there is a see-through house. It is like a normal Japanese house but all the walls are made of glass. There is plenty of daylight but no privacy. Architect Sou Fujimoto designed it for a couple to make their home. He based his idea on early man living in trees. It wouldn't suit everyone but the couple who live there love the feeling of being surrounded by the natural world.", vi: "B. Ở Tokyo, Nhật Bản, có một ngôi nhà trong suốt. Nó giống như một ngôi nhà bình thường của Nhật Bản, nhưng tất cả các bức tường đều được làm bằng kính. Ngôi nhà có rất nhiều ánh sáng tự nhiên nhưng lại không có sự riêng tư..." },
          { en: "C. All around the world, people live in homes made from shipping containers. Some use only one container, while others are made from several containers joined together. One house in Chile was built from 12 containers. They are cheap to buy and eco-friendly. They can also be placed in the garden or drive as guest rooms, studies or utility rooms.", vi: "C. Trên khắp thế giới, mọi người sống trong những ngôi nhà được làm từ container vận chuyển hàng hóa. Một số ngôi nhà chỉ sử dụng một container, trong khi những ngôi nhà khác được làm từ nhiều container ghép lại với nhau..." },
          { en: "D. In Germany, you can stay in a one-metre-square house, the smallest house in the world, called the House NA. Van Bo Le-Mentzel, a refugee from Laos, built it to draw attention to the world housing shortage. It is a wooden structure on wheels and weighs 40 kg. It has a locking door and window. You can turn it onto its side when you want to lie down. Franz from Munich spent the night in one recently 'just to see what it was like'. He found it a bit uncomfortable!", vi: "D. Ở Đức, bạn có thể ở trong một ngôi nhà rộng một mét vuông, ngôi nhà nhỏ nhất thế giới, được gọi là House NA. Van Bo Le-Mentzel, một người tị nạn đến từ Lào, đã xây dựng ngôi nhà này nhằm thu hút sự chú ý đến tình trạng thiếu nhà ở trên thế giới..." },
          { en: "E. For an unusual holiday you can stay in an igloo, a house made of ice. These can be found in several countries including Sweden, Norway and Finland. They are built new every winter. Jenny and Callum, visitors from Australia, told us, 'We slept in an igloo last night. It's so cold there - minus 5 degrees centigrade. We used reindeer skins to keep warm.'", vi: "E. Để có một kỳ nghỉ khác thường, bạn có thể ở trong lều tuyết, một ngôi nhà làm bằng băng. Những ngôi nhà như vậy có thể được tìm thấy ở một số quốc gia, bao gồm Thụy Điển, Na Uy và Phần Lan. Chúng tôi đã mặc áo khoác da tuần lộc để giữ ấm." },
          { en: "F. Another couple, Shaun and Rachel from Manchester, enjoyed a recent holiday in a treehouse in Sussex, England. They said, 'It was right up in the trees and had everything we needed, even wifi! It had a small kitchen and we did our own cooking. It was the perfect place to get away from our busy lives.'", vi: "F. Một cặp đôi khác, Shaun và Rachel đến từ Manchester, đã tận hưởng một kỳ nghỉ gần đây trong một ngôi nhà trên cây ở Sussex, Anh. Họ cho biết: '...Đây là nơi hoàn hảo để rời xa cuộc sống bận rộn của mình.'" }
        ],
        questions: [
          { q: "1. The two people who live in the transparent house love it, but it wouldn't _______", ans: ["suit everyone"], loc: "Đoạn B: 'It wouldn't suit everyone but the couple who live there love...'", exp: "Đoạn B nêu rõ ngôi nhà kính này không phù hợp với tất cả mọi người ('suit everyone')." },
          { q: "2. The designer of the smallest house hopes to _______ to the lack of houses all over the world.", ans: ["draw attention"], loc: "Đoạn D: '...built it to draw attention to the world housing shortage.'", exp: "Cụm 'draw attention to' đồng nghĩa với việc hướng sự chú ý tới tình trạng thiếu nhà." },
          { q: "3. People who stay in igloos sometimes protect themselves from the cold by making use of _______", ans: ["reindeer skins"], loc: "Đoạn E: 'We used reindeer skins to keep warm.'", exp: "Jenny và Callum dùng da tuần lộc ('reindeer skins') để giữ ấm." },
          { q: "4. People who have _______ would find a holiday in a treehouse ideal.", ans: ["busy lives"], loc: "Đoạn F: 'It was the perfect place to get away from our busy lives.'", exp: "Ngôi nhà trên cây là điểm đến lý tưởng cho những người có cuộc sống bận rộn ('busy lives')." }
        ],
        vocab: [
          { word: "see-through", type: "adj", ipa: "/ˈsiː.θruː/", def: "Trong suốt, nhìn xuyên qua được", ex: "The building has see-through glass walls.", viEx: "Tòa nhà có các bức tường kính trong suốt." },
          { word: "shortage", type: "n", ipa: "/ˈʃɔː.tɪdʒ/", def: "Sự thiếu hụt, khan hiếm", ex: "There is an acute housing shortage in the city.", viEx: "Có tình trạng thiếu hụt nhà ở trầm trọng trong thành phố." }
        ],
        paraphrase: [
          { pair: "draw attention <-> attract notice", mean: "Thu hút sự chú ý", exEn: "The protest drew attention to the crisis.", exVi: "Cuộc biểu tình đã thu hút sự chú ý đến cuộc khủng hoảng." },
          { pair: "lack of houses <-> housing shortage", mean: "Sự khan hiếm nhà ở", exEn: "The lack of houses drives up rent.", exVi: "Sự thiếu hụt nhà ở đẩy giá thuê lên cao." }
        ]
      },
      {
        id: 2,
        part: "01. SENTENCE COMPLETION",
        title: "Activity 2: HOME FROM HOME",
        instruction: "Read the passage and complete the sentences below. Choose NO MORE THAN THREE WORDS from the passage for each answer.",
        passage: [
          { en: "I remember feeling the first time I left home that I would never be able to feel at home anywhere but in my home. No other place would have my mum and dad, my annoying little brother and my cat, Tilly. Nowhere would smell like my home – my mum's roast chicken in the oven and the salty, seaweed smell that drifted in from the nearby beach. The sound of seagulls squawking was the sound of home. Nowhere else would I feel comfortable enough to put my feet up under me and gaze into the log fire dreaming of the future.", vi: "Tôi nhớ lần đầu tiên rời khỏi nhà, tôi đã cảm thấy rằng mình sẽ không bao giờ có thể cảm thấy thoải mái như ở nhà khi ở bất kỳ nơi nào khác. Không nơi nào khác có mẹ và bố đáng yêu của tôi, em trai tôi và chú mèo Tilly. Mùi món gà quay của mẹ trong lò nướng..." },
          { en: "I was 15 when I first went away from home on a school trip to Germany. My friends were going too, but we would all stay with different families. I was nervous about this. I knew the home I was going to would not be as comfortable as mine, the family would not be as kind, and who knew what the German food would be like? I knew I would spend three weeks, homesick and sad, missing my family back home.", vi: "Tôi 15 tuổi khi lần đầu tiên xa nhà trong chuyến đi của trường tới Đức. Tôi biết mình sẽ phải trải qua ba tuần nhớ nhà và buồn bã..." },
          { en: "We arrived in Germany late at night after a long journey by coach and boat. I was tired and hungry. We went into the school hall, where the host families were waiting to meet us. I wondered which one would be mine. Would they give me dinner at this time and would I be able to eat the unfamiliar food? Suddenly I heard my name called and the name of my exchange partner, Brigitte Schmitt. A pretty, blonde girl stepped forward, smiling widely. Behind her stood her parents, a pleasant-looking couple who were also smiling. They held out their hands and said, 'Wilkommen in Deutschland. Welcome to Germany.'", vi: "Chúng tôi đến Đức vào đêm muộn... Đột nhiên tên tôi được gọi cùng người bạn trao đổi Brigitte Schmitt. Phía sau cô ấy là bố mẹ của cô, một cặp vợ chồng dễ mến..." },
          { en: "I spent three happy weeks with the Schmitt family. Brigitte had an elder brother, Hendrik, and a younger sister, Lisa. They had two cats, Ping and Pong, who sat on my lap as I looked into the fire in the evenings. The whole family were kind and welcoming. My room was cosy and warm and we looked out onto a forest. The fresh clean smell of the trees and of apples baking in the oven became familiar and comforting, like the smells of home. I learnt in those three weeks that you can feel at home anywhere that people are kind to you.", vi: "Tôi trải qua ba tuần hạnh phúc với gia đình Schmitt. Họ có 2 chú mèo tên là Ping và Pong. Phòng tôi ấm cúng và nhìn ra một khu rừng..." },
          { en: "Later that year, Brigitte came to stay with me in the UK. I gave her my room and moved in with my brother. I cleared space for her clothes and put fresh flowers in a vase by the bed. I asked my mum to make her famous roast chicken and an apple pie to make our guest feel at home. We made a welcome banner and put it up on the front door. I did everything I could to help Brigitte feel at home with us. I now understood the importance of a warm welcome.", vi: "Cuối năm đó, Brigitte sang ở với tôi tại Anh. Tôi làm mọi thứ có thể để giúp bạn cảm thấy như ở nhà..." }
        ],
        questions: [
          { q: "1. The writer's mother often cooks _______", ans: ["roast chicken"], loc: "Đoạn 1: '...my mum's roast chicken in the oven...'", exp: "Món ăn mẹ tác giả hay nấu trong lò là món 'roast chicken'." },
          { q: "2. She thought the visit to Germany would make her feel _______", ans: ["homesick and sad"], loc: "Đoạn 2: 'I knew I would spend three weeks, homesick and sad...'", exp: "Tác giả từng nghĩ mình sẽ có 3 tuần buồn bã và nhớ nhà ('homesick and sad')." },
          { q: "3. Brigitte came to pick up the girl with _______", ans: ["her parents"], loc: "Đoạn 3: 'Behind her stood her parents, a pleasant-looking couple...'", exp: "Brigitte đi cùng với bố mẹ cô ấy ('her parents')." },
          { q: "4. The Schmitt family's pets' names are _______", ans: ["ping and pong"], loc: "Đoạn 4: 'They had two cats, Ping and Pong...'", exp: "Tên hai chú mèo là 'Ping and Pong'." },
          { q: "5. From her bedroom the girl could see _______", ans: ["a forest", "forest"], loc: "Đoạn 4: 'My room was cosy and warm and we looked out onto a forest.'", exp: "Từ phòng ngủ cô bé nhìn ra một khu rừng ('a forest')." },
          { q: "6. The girl and her family tried hard to make Brigitte _______", ans: ["feel at home"], loc: "Đoạn 5: 'I did everything I could to help Brigitte feel at home with us.'", exp: "Gia đình cố gắng để bạn cảm thấy như ở nhà ('feel at home')." }
        ],
        vocab: [
          { word: "homesick", type: "adj", ipa: "/ˈhəʊm.sɪk/", def: "Nhớ nhà", ex: "He felt homesick on his first trip abroad.", viEx: "Anh ấy thấy nhớ nhà trong chuyến đi nước ngoài đầu tiên." },
          { word: "cosy", type: "adj", ipa: "/ˈkəʊ.zi/", def: "Ấm cúng", ex: "A cosy fireplace kept the room warm.", viEx: "Lò sưởi ấm cúng giữ ấm cho cả căn phòng." }
        ],
        paraphrase: [
          { pair: "make someone feel at home <-> give a warm welcome", mean: "Chào đón nồng hậu để khách thấy tự nhiên", exEn: "They gave us a warm welcome.", exVi: "Họ chào đón chúng tôi rất nồng hậu." }
        ]
      },
      {
        id: 3,
        part: "01. SENTENCE COMPLETION",
        title: "Activity 3: FOOD CULTURE SHOCK",
        instruction: "Complete these sentences using a word from the text.",
        passage: [

        else el.classList.add('hidden');

    function toggleParaEx(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden');
    }

    // TTS AI Reader
    function toggleAudio() {
      if (!synth) {
        alert("Trình duyệt không hỗ trợ Web Speech AI!");
        return;
      }
      const icon = document.getElementById('audio-icon');
      const text = document.getElementById('audio-text');
      const rate = parseFloat(document.getElementById('audio-rate').value) || 1.0;

      if (isPlaying) {
        synth.cancel();
        isPlaying = false;
        icon.className = "fa-solid fa-play";
        text.textContent = "Audio AI";
      } else {
        synth.cancel();
        const paras = document.querySelectorAll('#passage-container .en-text');
        let fullText = ACTIVITIES[currentActIndex].title + ". ";
        paras.forEach(p => fullText += p.innerText + " ");

        utterance = new SpeechSynthesisUtterance(fullText);
        utterance.lang = 'en-US';
        utterance.rate = rate;

        utterance.onend = () => {
          isPlaying = false;
          icon.className = "fa-solid fa-play";
          text.textContent = "Audio AI";
        };
        utterance.onerror = () => {
          isPlaying = false;
          icon.className = "fa-solid fa-play";
          text.textContent = "Audio AI";
        };

        synth.speak(utterance);
        isPlaying = true;
        icon.className = "fa-solid fa-stop";
        text.textContent = "Dừng";
      }
    }

    // Làm sạch câu trả lời để chấm điểm linh hoạt

      return (s || "").trim().toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ");

        const fb = document.getElementById(`fb-${idx}`);

        // So khớp với bất kỳ đáp án hợp lệ nào
        const isCorrect = q.ans.some(a => cleanStr(a) === userVal);

        fb.classList.remove('hidden');

        if (isCorrect && userVal !== '') {
          correctCount++;
          input.className = "w-full px-3 py-1.5 text-xs md:text-sm border-2 border-emerald-500 bg-emerald-50 text-emerald-900 rounded-lg focus:outline-none";
          fb.className = "mt-2 p-2.5 rounded-lg text-xs leading-relaxed bg-emerald-50 border border-emerald-200 text-emerald-950";
          fb.innerHTML = `
            <div class="font-bold flex items-center gap-1 text-emerald-700">
              <i class="fa-solid fa-circle-check"></i> Chính xác!
            </div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Vị trí:</span> ${q.loc}</div>
            <div class="mt-0.5"><span class="font-semibold text-slate-700">Giải thích:</span> ${q.exp}</div>
          `;
        } else {
          input.className = "w-full px-3 py-1.5 text-xs md:text-sm border-2 border-rose-500 bg-rose-50 text-rose-900 rounded-lg focus:outline-none";
          fb.className = "mt-2 p-2.5 rounded-lg text-xs leading-relaxed bg-rose-50 border border-rose-200 text-rose-950";
          fb.innerHTML = `
            <div class="font-bold flex items-center gap-1 text-rose-700">
              <i class="fa-solid fa-circle-xmark"></i> Chưa chính xác!
            </div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Đáp án chuẩn:</span> <strong class="text-rose-800 uppercase font-mono">${q.ans[0]}</strong></div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Vị trí:</span> ${q.loc}</div>
            <div class="mt-0.5"><span class="font-semibold text-slate-700">Giải thích:</span> ${q.exp}</div>
          `;
        }
      });

      // Hiển thị điểm số
      const badge = document.getElementById('score-badge');
      const display = document.getElementById('score-display');
      badge.classList.remove('hidden');
      display.textContent = `${correctCount}/${total}`;

      // Cuộn lên câu hỏi đầu tiên
      document.querySelector('[data-qid="0"]').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Reset form hiện tại
    function resetCurrentQuiz() {
      const act = ACTIVITIES[currentActIndex];
      act.questions.forEach((q, idx) => {
        const input = document.getElementById(`ans-${idx}`);
        input.value = '';
        input.className = "w-full px-3 py-1.5 text-xs md:text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition";
        const fb = document.getElementById(`fb-${idx}`);
        fb.className = "hidden mt-2 p-2.5 rounded-lg text-xs leading-relaxed";
        fb.innerHTML = '';
      });
      document.getElementById('score-badge').classList.add('hidden');
    }

    // Khởi động trang web khi load
    window.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      selectActivity(0);
    });
  </script>
</body>
</html>
