<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Reading Master - Highlight Cả 2 Cột</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    /* Các lớp highlight trong suốt sắc nét */
    .hl-yellow {
      background-color: rgba(254, 240, 138, 0.8) !important;
      border-radius: 2px;
      padding: 1px 2px;
    }
    .hl-green {
      background-color: rgba(187, 247, 208, 0.8) !important;
      border-radius: 2px;
      padding: 1px 2px;
    }
    .hl-cyan {
      background-color: rgba(186, 230, 253, 0.8) !important;
      border-radius: 2px;
      padding: 1px 2px;
    }
    .hl-pink {
      background-color: rgba(251, 207, 232, 0.8) !important;
      border-radius: 2px;
      padding: 1px 2px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col select-auto">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg bg-indigo-800 hover:bg-indigo-900 transition text-white">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <span class="bg-white text-indigo-700 px-2.5 py-1 rounded-md font-extrabold text-sm uppercase tracking-wide">IELTS</span>
        <div>
          <h1 class="text-base md:text-lg font-bold leading-tight line-clamp-1" id="top-title">IELTS Reading - Round 2</h1>
          <p class="text-xs text-indigo-200 hidden sm:block" id="top-subtitle">Practice today, Success tomorrow!</p>
        </div>
      </div>
      <div class="flex items-center space-x-2 text-xs md:text-sm">
        <span id="score-badge" class="hidden bg-emerald-600 px-3 py-1.5 rounded-full font-semibold shadow">
          Điểm: <span id="score-display">0/0</span>
        </span>
        <button onclick="toggleSidebar()" class="hidden lg:flex items-center gap-1.5 bg-indigo-800/80 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-500/30 text-xs transition">
          <i class="fa-solid fa-list-ul"></i> Chọn Bài
        </button>
      </div>
    </div>
  </header>

  <!-- Container -->
  <div class="max-w-7xl mx-auto px-4 py-4 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-5 relative">
    
    <!-- Sidebar Menu 18 Bài Tập -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 lg:w-full lg:col-span-3 lg:shadow-none lg:bg-transparent flex flex-col h-[calc(100vh-80px)] lg:h-[calc(100vh-100px)] sticky top-20">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-full overflow-hidden">
        <div class="p-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center space-x-2 text-slate-800 font-bold text-sm">
            <i class="fa-solid fa-layer-group text-indigo-600"></i>
            <span>18 IELTS Activities</span>
          </div>
          <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
        <div id="activity-menu" class="flex-1 overflow-y-auto p-2 space-y-1.5 custom-scrollbar text-xs">
          <!-- Render tự động bằng JS -->
        </div>
      </div>
    </aside>

    <!-- Khu vực 2 cột làm bài -->
    <main class="lg:col-span-9 grid grid-cols-1 xl:grid-cols-12 gap-5">
      
      <!-- CỘT TRÁI: BÀI ĐỌC -->
      <section id="left-column-section" class="xl:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5 flex flex-col h-[calc(100vh-100px)] sticky top-20 relative">
        
        <!-- Toolbar Cột Trái -->
        <div class="pb-3 mb-2 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2 bg-slate-50/80 p-2.5 rounded-xl border border-slate-200/60">
          <div class="flex items-center space-x-1.5">
            <button id="btn-audio-play" onclick="toggleAudio()" class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
              <i id="audio-icon" class="fa-solid fa-play"></i>
              <span id="audio-text">Audio AI</span>
            </button>
            <div class="flex items-center space-x-1 bg-white px-2 py-1 rounded-lg border border-slate-200 text-xs">
              <i class="fa-solid fa-gauge-high text-slate-400 text-[10px]"></i>
              <select id="audio-rate" class="bg-transparent font-medium text-slate-700 text-xs focus:outline-none">
                <option value="0.8">0.8x</option>
                <option value="1" selected>1.0x</option>
                <option value="1.2">1.2x</option>
              </select>
            </div>
          </div>
          
          <div class="flex items-center space-x-1.5">
            <button onclick="clearLeftHighlights()" class="px-2 py-1.5 bg-white border border-rose-200 text-rose-600 hover:bg-rose-50 rounded-lg text-xs font-medium transition flex items-center gap-1 shadow-sm" title="Xóa toàn bộ highlight bài đọc">
              <i class="fa-solid fa-eraser"></i> Xóa HL
            </button>
            <button onclick="toggleTranslation()" class="px-2.5 py-1.5 bg-white border border-indigo-200 text-indigo-700 hover:bg-indigo-50 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
              <i class="fa-solid fa-language text-indigo-600"></i>
              <span id="trans-btn-text">Xem Bản Dịch</span>
            </button>
          </div>
        </div>

        <!-- Tooltip nổi Highlight cho Cột Trái -->
        <div id="left-hl-toolbar" class="hidden absolute z-50 bg-slate-900 text-white px-2.5 py-1.5 rounded-xl shadow-xl flex items-center gap-2 border border-slate-700 text-xs transition-opacity duration-200">
          <span class="text-[11px] text-slate-300 font-medium">Tô màu:</span>
          <button onclick="applyHighlight('hl-yellow')" class="w-5 h-5 rounded-full bg-yellow-300 hover:scale-110 border border-white/50 transition"></button>
          <button onclick="applyHighlight('hl-green')" class="w-5 h-5 rounded-full bg-emerald-300 hover:scale-110 border border-white/50 transition"></button>
          <button onclick="applyHighlight('hl-cyan')" class="w-5 h-5 rounded-full bg-sky-300 hover:scale-110 border border-white/50 transition"></button>
          <button onclick="applyHighlight('hl-pink')" class="w-5 h-5 rounded-full bg-pink-300 hover:scale-110 border border-white/50 transition"></button>
          <div class="h-3.5 w-px bg-slate-700 mx-0.5"></div>
          <button onclick="removeSelectedHighlight()" class="text-rose-400 hover:text-rose-300 text-xs flex items-center gap-1 px-1">
            <i class="fa-solid fa-trash-can text-[11px]"></i> Xóa
          </button>
        </div>

        <!-- Nội dung Passage -->
        <div id="passage-container" class="overflow-y-auto pr-2 custom-scrollbar space-y-4 text-slate-700 text-sm leading-relaxed select-text">
          <!-- Render qua JS -->
        </div>
      </section>

      <!-- CỘT PHẢI: CÂU HỎI & TỪ VỰNG -->
      <section id="right-column-section" class="xl:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[calc(100vh-100px)] sticky top-20 overflow-hidden relative">
        
        <!-- Tab Headers -->
        <div class="flex border-b border-slate-200 bg-slate-50">
          <button id="tab-btn-quiz" onclick="switchTab('quiz')" class="flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-indigo-600 text-indigo-700 flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-list-check"></i> Câu Hỏi & Bài Làm
          </button>
          <button id="tab-btn-vocab" onclick="switchTab('vocab')" class="flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-table-list"></i> Bảng Paraphrase & Từ Vựng
          </button>
        </div>

        <!-- THANH CÔNG CỤ BÚT HIGHLIGHT CỐ ĐỊNH CHO CỘT CÂU HỎI -->
        <div class="px-3 py-2 bg-slate-100/90 border-b border-slate-200 flex items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-2">
            <span class="text-slate-600 font-semibold flex items-center gap-1 text-[11px]">
              <i class="fa-solid fa-highlighter text-amber-500"></i> Bút câu hỏi:
            </span>
            <div class="flex items-center gap-1.5">
              <button onclick="applyHighlight('hl-yellow')" class="w-5 h-5 rounded-full bg-yellow-300 hover:scale-110 border border-slate-300 shadow-sm transition" title="Tô Vàng"></button>
              <button onclick="applyHighlight('hl-green')" class="w-5 h-5 rounded-full bg-emerald-300 hover:scale-110 border border-slate-300 shadow-sm transition" title="Tô Xanh lá"></button>
              <button onclick="applyHighlight('hl-cyan')" class="w-5 h-5 rounded-full bg-sky-300 hover:scale-110 border border-slate-300 shadow-sm transition" title="Tô Xanh ngọc"></button>
              <button onclick="applyHighlight('hl-pink')" class="w-5 h-5 rounded-full bg-pink-300 hover:scale-110 border border-slate-300 shadow-sm transition" title="Tô Hồng"></button>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="removeSelectedHighlight()" class="px-2 py-0.5 bg-white border border-slate-300 hover:bg-slate-50 rounded text-slate-600 font-medium text-[11px] shadow-sm transition" title="Bôi đen đoạn cần bỏ màu rồi bấm nút này">
              Bỏ tô
            </button>
            <button onclick="clearRightHighlights()" class="px-2 py-0.5 bg-rose-50 border border-rose-200 hover:bg-rose-100 text-rose-700 rounded font-medium text-[11px] shadow-sm transition" title="Xóa hết màu ở cột phải">
              Xóa tất cả
            </button>
          </div>
        </div>

        <!-- Tooltip nổi nhỏ khi bôi đen ở Cột Phải -->
        <div id="right-hl-toolbar" class="hidden absolute z-50 bg-slate-900 text-white px-2.5 py-1.5 rounded-xl shadow-xl flex items-center gap-2 border border-slate-700 text-xs transition-opacity duration-200">
          <span class="text-[11px] text-slate-300 font-medium">Tô màu:</span>
          <button onclick="applyHighlight('hl-yellow')" class="w-5 h-5 rounded-full bg-yellow-300 hover:scale-110 border border-white/50 transition"></button>
          <button onclick="applyHighlight('hl-green')" class="w-5 h-5 rounded-full bg-emerald-300 hover:scale-110 border border-white/50 transition"></button>
          <button onclick="applyHighlight('hl-cyan')" class="w-5 h-5 rounded-full bg-sky-300 hover:scale-110 border border-white/50 transition"></button>
          <button onclick="applyHighlight('hl-pink')" class="w-5 h-5 rounded-full bg-pink-300 hover:scale-110 border border-white/50 transition"></button>
          <div class="h-3.5 w-px bg-slate-700 mx-0.5"></div>
          <button onclick="removeSelectedHighlight()" class="text-rose-400 hover:text-rose-300 text-xs flex items-center gap-1 px-1">
            <i class="fa-solid fa-trash-can text-[11px]"></i>
          </button>
        </div>

        <!-- Tab 1: Quiz Form -->
        <div id="tab-quiz" class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-4 select-text">
          <div id="quiz-instruction" class="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-lg text-xs text-amber-900 leading-snug">
            <!-- Render đề bài -->
          </div>
          <form id="reading-quiz" onsubmit="submitQuiz(event)" class="space-y-4">
            <div id="questions-list" class="space-y-4">
              <!-- Render câu hỏi -->
            </div>
            <div class="flex items-center gap-2 pt-2">
              <button type="submit" class="flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition text-xs flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Nộp Bài & Xem Giải Thích
              </button>
              <button type="button" onclick="resetCurrentQuiz()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition">
                <i class="fa-solid fa-rotate-right"></i>
              </button>
            </div>
          </form>
        </div>

        <!-- Tab 2: Vocab & Paraphrase -->
        <div id="tab-vocab" class="hidden flex-1 overflow-y-auto p-4 custom-scrollbar space-y-5 select-text">
          <!-- Bảng Paraphrase chuẩn format như hình ảnh -->
          <div id="para-content" class="space-y-3">
            <!-- Render bảng Paraphrase -->
          </div>

          <!-- Từ vựng -->
          <div id="vocab-content" class="space-y-3 pt-3 border-t border-slate-200">
            <!-- Render từ vựng -->
          </div>
        </div>

      </section>

    </main>

  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    const ACTIVITIES = [
      {
        id: 1,
        part: "01. SENTENCE COMPLETION",
        title: "Activity 1: AMAZING HOMES",
        instruction: "Complete the sentences. Choose NO MORE THAN TWO WORDS from the passage for each answer.",
        passage: [
          { en: "Most people live in a house or a flat. When they go on holiday they stay in a hotel or a guest house. But some places where you can live or stay are a bit different.", vi: "Hầu hết mọi người sống trong một ngôi nhà hoặc căn hộ. Khi đi nghỉ, họ thường ở khách sạn hoặc nhà nghỉ. Nhưng một số nơi mà bạn có thể sinh sống hoặc lưu trú lại có phần khác biệt." },
          { en: "A. One unusual place to live is a houseboat. Amsterdam in Holland is famous for its houseboats - there are about 2,500 of them. They have everything that normal houses have: a living room, bedroom, kitchen, bathroom and even sometimes a terrace on the roof. They are cheaper than houses and people who live on houseboats enjoy being close to nature. Some houseboats can be moved to other parts of the river, while others are permanently in one place.", vi: "A. Một nơi ở khác thường là nhà thuyền. Amsterdam ở Hà Lan nổi tiếng với những ngôi nhà thuyền – có khoảng 2.500 ngôi nhà như vậy. Chúng có mọi thứ mà những ngôi nhà bình thường có..." },
          { en: "B. In Tokyo, Japan, there is a see-through house. It is like a normal Japanese house but all the walls are made of glass. There is plenty of daylight but no privacy. Architect Sou Fujimoto designed it for a couple to make their home. He based his idea on early man living in trees. It wouldn't suit everyone but the couple who live there love the feeling of being surrounded by the natural world.", vi: "B. Ở Tokyo, Nhật Bản, có một ngôi nhà trong suốt. Nó giống như một ngôi nhà bình thường của Nhật Bản, nhưng tất cả các bức tường đều được làm bằng kính. Ngôi nhà có rất nhiều ánh sáng tự nhiên nhưng lại không có sự riêng tư..." },
          { en: "C. All around the world, people live in homes made from shipping containers. Some use only one container, while others are made from several containers joined together. One house in Chile was built from 12 containers. They are cheap to buy and eco-friendly.", vi: "C. Trên khắp thế giới, mọi người sống trong những ngôi nhà làm từ container chở hàng. Chúng rẻ và thân thiện với môi trường..." },
          { en: "D. In Germany, you can stay in a one-metre-square house, the smallest house in the world, called the House NA. Van Bo Le-Mentzel, a refugee from Laos, built it to draw attention to the world housing shortage. It is a wooden structure on wheels and weighs 40 kg. It has a locking door and window.", vi: "D. Ở Đức, bạn có thể ở trong ngôi nhà 1 mét vuông nhỏ nhất thế giới. Người ta dựng nên nó nhằm thu hút sự chú ý tới nạn thiếu hụt nhà ở..." },
          { en: "E. For an unusual holiday you can stay in an igloo, a house made of ice. These can be found in several countries including Sweden, Norway and Finland. They are built new every winter. Jenny and Callum, visitors from Australia, told us, 'We slept in an igloo last night. It's so cold there - minus 5 degrees centigrade. We used reindeer skins to keep warm.'", vi: "E. Để có một kỳ nghỉ khác thường bạn có thể ở lều tuyết igloo. Jenny và Callum chia sẻ: 'Chúng tôi dùng da tuần lộc để giữ ấm.'" },
          { en: "F. Another couple, Shaun and Rachel from Manchester, enjoyed a recent holiday in a treehouse in Sussex, England. They said, 'It was right up in the trees and had everything we needed, even wifi! It had a small kitchen and we did our own cooking. It was the perfect place to get away from our busy lives.'", vi: "F. Một cặp đôi khác đi nghỉ trong ngôi nhà trên cây: 'Đây là nơi hoàn hảo để trốn khỏi cuộc sống bận rộn.'" }
        ],
        questions: [
          { q: "1. The two people who live in the transparent house love it, but it wouldn't _______", ans: ["suit everyone"], loc: "Đoạn B: 'It wouldn't suit everyone but the couple who live there love...'", exp: "Đoạn B chỉ rõ ngôi nhà kính không phù hợp với tất cả mọi người ('suit everyone')." },
          { q: "2. The designer of the smallest house hopes to _______ to the lack of houses all over the world.", ans: ["draw attention"], loc: "Đoạn D: '...built it to draw attention to the world housing shortage.'", exp: "'draw attention' có nghĩa là thu hút sự chú ý đến sự thiếu hụt nhà ở." },
          { q: "3. People who stay in igloos sometimes protect themselves from the cold by making use of _______", ans: ["reindeer skins"], loc: "Đoạn E: 'We used reindeer skins to keep warm.'", exp: "Họ sử dụng da tuần lộc ('reindeer skins') để giữ ấm." },
          { q: "4. People who have _______ would find a holiday in a treehouse ideal.", ans: ["busy lives"], loc: "Đoạn F: 'It was the perfect place to get away from our busy lives.'", exp: "Ngôi nhà trên cây lý tưởng cho người có cuộc sống bận rộn ('busy lives')." }
        ],
        paraphraseTable: [
          { qWord: "transparent house", pWord: "see-through house", note: "Ngôi nhà kính trong suốt" },
          { qWord: "two people", pWord: "the couple", note: "Hai người / cặp vợ chồng" },
          { qWord: "the designer", pWord: "Architect Sou Fujimoto / built it", note: "Người thiết kế, kiến trúc sư" },
          { qWord: "lack of houses", pWord: "housing shortage", note: "Sự khan hiếm, thiếu thốn nhà ở" },
          { qWord: "protect themselves from the cold", pWord: "keep warm", note: "Bảo vệ khỏi cái lạnh / giữ ấm" },
          { qWord: "making use of", pWord: "used", note: "Tận dụng, sử dụng" },
          { qWord: "ideal holiday", pWord: "perfect place to get away", note: "Kỳ nghỉ lý tưởng" }
        ],
        vocab: [
          { word: "see-through", type: "adj", ipa: "/ˈsiː.θruː/", def: "Trong suốt, nhìn xuyên thấu", ex: "The building has see-through glass walls.", viEx: "Tòa nhà có tường kính trong suốt." },
          { word: "shortage", type: "n", ipa: "/ˈʃɔː.tɪdʒ/", def: "Sự thiếu hụt, khan hiếm", ex: "The city faces an acute housing shortage.", viEx: "Thành phố đối mặt tình trạng thiếu nhà trầm trọng." }
        ]
      },
      {
        id: 2,
        part: "01. SENTENCE COMPLETION",
        title: "Activity 2: HOME FROM HOME",
        instruction: "Read the passage and complete the sentences below. Choose NO MORE THAN THREE WORDS from the passage for each answer.",
        passage: [
          { en: "I remember feeling the first time I left home that I would never be able to feel at home anywhere but in my home. No other place would have my mum and dad, my annoying little brother and my cat, Tilly. Nowhere would smell like my home – my mum's roast chicken in the oven and the salty, seaweed smell that drifted in from the nearby beach. The sound of seagulls squawking was the sound of home. Nowhere else would I feel comfortable enough to put my feet up under me and gaze into the log fire dreaming of the future.", vi: "Tôi nhớ lần đầu tiên rời khỏi nhà, tôi đã cảm thấy rằng mình sẽ không bao giờ có thể cảm thấy thoải mái như ở nhà khi ở bất kỳ nơi nào khác. Không nơi nào khác có mẹ và bố đáng yêu của tôi, em trai tôi và chú mèo Tilly. Mùi món gà quay của mẹ trong lò nướng và mùi mằn mặn của rong biển..." },
          { en: "I was 15 when I first went away from home on a school trip to Germany. My friends were going too, but we would all stay with different families. I was nervous about this. I knew the home I was going to would not be as comfortable as mine, the family would not be as kind, and who knew what the German food would be like? I knew I would spend three weeks, homesick and sad, missing my family back home.", vi: "Tôi 15 tuổi khi lần đầu tiên xa nhà trong một chuyến đi của trường tới Đức. Bạn bè tôi cũng đi, nhưng tất cả chúng tôi sẽ ở với những gia đình khác nhau. Tôi rất lo lắng về điều này. Tôi biết mình sẽ phải trải qua ba tuần nhớ nhà và buồn bã, nhớ gia đình ở quê nhà." },
          { en: "We arrived in Germany late at night after a long journey by coach and boat. I was tired and hungry. We went into the school hall, where the host families were waiting to meet us. I wondered which one would be mine. Would they give me dinner at this time and would I be able to eat the unfamiliar food? Suddenly I heard my name called and the name of my exchange partner, Brigitte Schmitt. A pretty, blonde girl stepped forward, smiling widely. Behind her stood her parents, a pleasant-looking couple who were also smiling. They held out their hands and said, 'Wilkommen in Deutschland. Welcome to Germany.'", vi: "Chúng tôi đến Đức vào đêm muộn sau một hành trình dài. Đột nhiên tôi nghe thấy tên mình được gọi cùng với tên bạn học trao đổi Brigitte Schmitt. Một cô gái tóc vàng xinh xắn bước lên phía trước, nở nụ cười thật tươi. Đứng phía sau cô ấy là bố mẹ cô..." },
          { en: "I spent three happy weeks with the Schmitt family. Brigitte had an elder brother, Hendrik, and a younger sister, Lisa. They had two cats, Ping and Pong, who sat on my lap as I looked into the fire in the evenings. The whole family were kind and welcoming. My room was cosy and warm and we looked out onto a forest. The fresh clean smell of the trees and of apples baking in the oven became familiar and comforting, like the smells of home. I learnt in those three weeks that you can feel at home anywhere that people are kind to you.", vi: "Tôi đã trải qua ba tuần vui vẻ cùng gia đình Schmitt. Brigitte có anh trai Hendrik và em gái Lisa. Họ có hai chú mèo, Ping và Pong. Căn phòng của tôi ấm cúng và nhìn ra một khu rừng..." },
          { en: "Later that year, Brigitte came to stay with me in the UK. I gave her my room and moved in with my brother. I cleared space for her clothes and put fresh flowers in a vase by the bed. I asked my mum to make her famous roast chicken and an apple pie to make our guest feel at home. We made a welcome banner and put it up on the front door. I did everything I could to help Brigitte feel at home with us. I now understood the importance of a warm welcome.", vi: "Cuối năm đó, Brigitte đến ở cùng tôi tại Anh. Tôi dọn phòng, cắm hoa và nhờ mẹ làm món gà quay nổi tiếng để bạn cảm thấy như ở nhà. Giờ đây tôi đã hiểu tầm quan trọng của sự đón tiếp nồng hậu." }
        ],

          { q: "2. She thought the visit to Germany would make her feel _______", ans: ["homesick and sad"], loc: "Đoạn 2: 'I knew I would spend three weeks, homesick and sad...'", exp: "Tác giả từng nghĩ mình sẽ có 3 tuần buồn bã và nhớ nhà ('homesick and sad')." },
          { q: "3. Brigitte came to pick up the girl with _______", ans: ["her parents"], loc: "Đoạn 3: 'Behind her stood her parents, a pleasant-looking couple...'", exp: "Brigitte đi cùng với bố mẹ cô ấy ('her parents')." },
          { q: "4. The Schmitt family's pets' names are _______", ans: ["ping and pong"], loc: "Đoạn 4: 'They had two cats, Ping and Pong...'", exp: "Tên hai chú mèo cưng là 'Ping and Pong'." },

    // ==========================================
    // CƠ CHẾ HIGHLIGHT UNIVERSAL CHO CẢ 2 CỘT
    // ==========================================
    const leftSection = document.getElementById('left-column-section');
    const rightSection = document.getElementById('right-column-section');
    const leftHlToolbar = document.getElementById('left-hl-toolbar');
    const rightHlToolbar = document.getElementById('right-hl-toolbar');

    document.addEventListener('mouseup', function (e) {
      if (leftHlToolbar.contains(e.target) || rightHlToolbar.contains(e.target)) return;

      const sel = window.getSelection();
      if (!sel.isCollapsed && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const container = range.commonAncestorContainer;

        // Bôi đen ở cột trái
        if (leftSection.contains(container)) {
          hideToolbars();
          savedRange = range.cloneRange();
          const rect = range.getBoundingClientRect();
          const pRect = leftSection.getBoundingClientRect();
          leftHlToolbar.style.top = `${rect.top - pRect.top - 42}px`;
          leftHlToolbar.style.left = `${Math.max(10, rect.left - pRect.left + (rect.width / 2) - 100)}px`;
          leftHlToolbar.classList.remove('hidden');
          return;
        }

        // Bôi đen ở cột phải (loại trừ ô input đang gõ)
        if (rightSection.contains(container) && e.target.tagName !== 'INPUT') {
          hideToolbars();
          savedRange = range.cloneRange();
          const rect = range.getBoundingClientRect();
          const pRect = rightSection.getBoundingClientRect();
          rightHlToolbar.style.top = `${rect.top - pRect.top - 42}px`;
          rightHlToolbar.style.left = `${Math.max(10, rect.left - pRect.left + (rect.width / 2) - 100)}px`;
          rightHlToolbar.classList.remove('hidden');
          return;
        }
      }
      hideToolbars();
    });

    function hideToolbars() {
      if (leftHlToolbar) leftHlToolbar.classList.add('hidden');
      if (rightHlToolbar) rightHlToolbar.classList.add('hidden');
    }

    // Áp dụng màu highlight cho vùng chọn hiện tại
    function applyHighlight(colorClass) {
      const sel = window.getSelection();
      let targetRange = savedRange;
      if (!sel.isCollapsed && sel.rangeCount > 0) {
        targetRange = sel.getRangeAt(0);
      }
      if (!targetRange) return;

      const span = document.createElement('span');
      span.className = colorClass;
      try {
        span.appendChild(targetRange.extractContents());
        targetRange.insertNode(span);
      } catch (err) {
        console.warn("Highlight range cross elements:", err);
      }

      window.getSelection().removeAllRanges();
      savedRange = null;
      hideToolbars();
    }

    // Xóa màu đoạn đang chọn
    function removeSelectedHighlight() {
      const sel = window.getSelection();
      let targetRange = savedRange;
      if (!sel.isCollapsed && sel.rangeCount > 0) {
        targetRange = sel.getRangeAt(0);
      }
      if (!targetRange) return;

      const common = targetRange.commonAncestorContainer;
      const parentSpan = common.nodeType === 1 ? common : common.parentElement;

      if (parentSpan && (parentSpan.classList.contains('hl-yellow') || parentSpan.classList.contains('hl-green') || parentSpan.classList.contains('hl-cyan') || parentSpan.classList.contains('hl-pink'))) {
        const parent = parentSpan.parentNode;
        while (parentSpan.firstChild) {
          parent.insertBefore(parentSpan.firstChild, parentSpan);
        }
        parent.removeChild(parentSpan);
      }
      window.getSelection().removeAllRanges();
      savedRange = null;
      hideToolbars();
    }

    function clearLeftHighlights() {
      if (!confirm("Xóa toàn bộ highlight ở bài đọc?")) return;
      const marks = leftSection.querySelectorAll('.hl-yellow, .hl-green, .hl-cyan, .hl-pink');
      marks.forEach(span => {
        const parent = span.parentNode;
        while (span.firstChild) {
          parent.insertBefore(span.firstChild, span);
        }
        parent.removeChild(span);
      });
      hideToolbars();
    }

    function clearRightHighlights() {
      if (!confirm("Xóa toàn bộ highlight ở phần câu hỏi?")) return;
      const marks = rightSection.querySelectorAll('.hl-yellow, .hl-green, .hl-cyan, .hl-pink');
      marks.forEach(span => {
        const parent = span.parentNode;
        while (span.firstChild) {
          parent.insertBefore(span.firstChild, span);
        }
        parent.removeChild(span);
      });
      hideToolbars();
    }

    // TTS AI Reader
    function toggleAudio() {
      if (!synth) {
        alert("Trình duyệt không hỗ trợ Web Speech AI!");
        return;
      }
      const icon = document.getElementById('audio-icon');
      const text = document.getElementById('audio-text');
      const rate = parseFloat(document.getElementById('audio-rate').value) || 1.0;

      if (isPlaying) {
        synth.cancel();
        isPlaying = false;
        icon.className = "fa-solid fa-play";
        text.textContent = "Audio AI";
      } else {
        synth.cancel();
        const paras = document.querySelectorAll('#passage-container .en-text');
        let fullText = ACTIVITIES[currentActIndex].title + ". ";
        paras.forEach(p => fullText += p.innerText + " ");

        utterance = new SpeechSynthesisUtterance(fullText);
        utterance.lang = 'en-US';
        utterance.rate = rate;

        utterance.onend = () => {
          isPlaying = false;
          icon.className = "fa-solid fa-play";
          text.textContent = "Audio AI";
        };
        utterance.onerror = () => {
          isPlaying = false;
          icon.className = "fa-solid fa-play";
          text.textContent = "Audio AI";
        };

        synth.speak(utterance);
        isPlaying = true;
        icon.className = "fa-solid fa-stop";
        text.textContent = "Dừng";
      }
    }

    function cleanStr(s) {
      return (s || "").trim().toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ");
    }

    function submitQuiz(e) {
      e.preventDefault();
      const act = ACTIVITIES[currentActIndex];
      let correctCount = 0;
      const total = act.questions.length;

      act.questions.forEach((q, idx) => {
        const input = document.getElementById(`ans-${idx}`);
        const userVal = cleanStr(input.value);
        const fb = document.getElementById(`fb-${idx}`);

        const isCorrect = q.ans.some(a => cleanStr(a) === userVal);
        fb.classList.remove('hidden');

        if (isCorrect && userVal !== '') {
          correctCount++;
          input.className = "w-full px-3 py-1.5 text-xs md:text-sm border-2 border-emerald-500 bg-emerald-50 text-emerald-900 rounded-lg focus:outline-none";
          fb.className = "mt-2 p-2.5 rounded-lg text-xs leading-relaxed bg-emerald-50 border border-emerald-200 text-emerald-950";
          fb.innerHTML = `
            <div class="font-bold flex items-center gap-1 text-emerald-700">
              <i class="fa-solid fa-circle-check"></i> Chính xác!
            </div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Vị trí:</span> ${q.loc}</div>
            <div class="mt-0.5"><span class="font-semibold text-slate-700">Giải thích:</span> ${q.exp}</div>
          `;
        } else {
          input.className = "w-full px-3 py-1.5 text-xs md:text-sm border-2 border-rose-500 bg-rose-50 text-rose-900 rounded-lg focus:outline-none";
          fb.className = "mt-2 p-2.5 rounded-lg text-xs leading-relaxed bg-rose-50 border border-rose-200 text-rose-950";
          fb.innerHTML = `
            <div class="font-bold flex items-center gap-1 text-rose-700">
              <i class="fa-solid fa-circle-xmark"></i> Chưa chính xác!
            </div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Đáp án chuẩn:</span> <strong class="text-rose-800 uppercase font-mono">${q.ans[0]}</strong></div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Vị trí:</span> ${q.loc}</div>
            <div class="mt-0.5"><span class="font-semibold text-slate-700">Giải thích:</span> ${q.exp}</div>
          `;
        }
      });

      const badge = document.getElementById('score-badge');
      const display = document.getElementById('score-display');
      badge.classList.remove('hidden');
      display.textContent = `${correctCount}/${total}`;

      document.querySelector('[data-qid="0"]').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function resetCurrentQuiz() {
      const act = ACTIVITIES[currentActIndex];
      act.questions.forEach((q, idx) => {
        const input = document.getElementById(`ans-${idx}`);
        input.value = '';
        input.className = "w-full px-3 py-1.5 text-xs md:text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition";
        const fb = document.getElementById(`fb-${idx}`);
        fb.className = "hidden mt-2 p-2.5 rounded-lg text-xs leading-relaxed";
        fb.innerHTML = '';
      });
      document.getElementById('score-badge').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      selectActivity(1); // Mặc định mở Activity 2
    });
  </script>
</body>
</html>
