<!DOCTYPE html>

<head>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col select-auto">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg bg-indigo-800 hover:bg-indigo-900 transition text-white">
          <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <span class="bg-white text-indigo-700 px-2.5 py-1 rounded-md font-extrabold text-sm uppercase tracking-wide">IELTS</span>
        <div>
          <h1 class="text-base md:text-lg font-bold leading-tight line-clamp-1" id="top-title">IELTS Reading - Round 2</h1>

        </div>
      </div>
      <div class="flex items-center space-x-2 text-xs md:text-sm">
        <span id="score-badge" class="hidden bg-emerald-600 px-3 py-1.5 rounded-full font-semibold shadow">
          Điểm: <span id="score-display">0/0</span>
        </span>
        <button onclick="toggleSidebar()" class="hidden lg:flex items-center gap-1.5 bg-indigo-800/80 hover:bg-indigo-900 px-3 py-1.5 rounded-lg border border-indigo-500/30 text-xs transition">
          <i class="fa-solid fa-list-ul"></i> Chọn Bài
        </button>
      </div>
    </div>
  </header>

  <!-- Container -->
  <div class="max-w-7xl mx-auto px-4 py-4 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-5 relative">
    
    <!-- Sidebar Menu 18 Bài Tập -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 lg:w-full lg:col-span-3 lg:shadow-none lg:bg-transparent flex flex-col h-[calc(100vh-80px)] lg:h-[calc(100vh-100px)] sticky top-20">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-full overflow-hidden">
        <div class="p-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center space-x-2 text-slate-800 font-bold text-sm">
            <i class="fa-solid fa-layer-group text-indigo-600"></i>
            <span>18 IELTS Activities</span>
          </div>
          <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>
        <div id="activity-menu" class="flex-1 overflow-y-auto p-2 space-y-1.5 custom-scrollbar text-xs">

        </div>

    <!-- Khu vực làm bài chính -->
    <main class="lg:col-span-9 grid grid-cols-1 xl:grid-cols-12 gap-5">
      
      <!-- CỘT TRÁI: Bài đọc, Audio AI, Nút Dịch, Công cụ Highlight -->
      <section class="xl:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5 flex flex-col h-[calc(100vh-100px)] sticky top-20 relative">
        
        <!-- Toolbar -->
        <div class="pb-3 mb-3 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2 bg-slate-50/80 p-2.5 rounded-xl border border-slate-200/60">

            <button id="btn-audio-play" onclick="toggleAudio()" class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
              <i id="audio-icon" class="fa-solid fa-play"></i>
              <span id="audio-text">Audio AI</span>
            </button>
            <div class="flex items-center space-x-1 bg-white px-2 py-1 rounded-lg border border-slate-200 text-xs">

              <select id="audio-rate" class="bg-transparent font-medium text-slate-700 text-xs focus:outline-none">

                <option value="1" selected>1.0x</option>
                <option value="1.2">1.2x</option>
              </select>
            </div>
          </div>
          
          <div class="flex items-center space-x-2">
            <button onclick="clearAllHighlights()" class="px-2.5 py-1.5 bg-white border border-rose-200 text-rose-600 hover:bg-rose-50 rounded-lg text-xs font-semibold transition flex items-center gap-1 shadow-sm" title="Xóa toàn bộ highlight trong bài">
              <i class="fa-solid fa-eraser"></i> Xóa Highlight
            </button>
            <button onclick="toggleTranslation()" class="px-2.5 py-1.5 bg-white border border-indigo-200 text-indigo-700 hover:bg-indigo-50 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">

              <span id="trans-btn-text">Xem Bản Dịch</span>
            </button>
          </div>
        </div>

        <!-- Tooltip nổi Highlight khi bôi đen chuột -->
        <div id="highlight-toolbar" class="hidden absolute z-50 bg-slate-900 text-white px-2.5 py-1.5 rounded-xl shadow-xl flex items-center gap-2 border border-slate-700 text-xs transition-opacity duration-200">
          <span class="text-[11px] text-slate-400 font-medium">Bút dạ:</span>
          <button onclick="applyHighlight('hl-yellow')" class="w-5 h-5 rounded-full bg-yellow-300 hover:scale-110 border border-white/50 transition"></button>
          <button onclick="applyHighlight('hl-green')" class="w-5 h-5 rounded-full bg-emerald-300 hover:scale-110 border border-white/50 transition"></button>
          <button onclick="applyHighlight('hl-cyan')" class="w-5 h-5 rounded-full bg-sky-300 hover:scale-110 border border-white/50 transition"></button>
          <button onclick="applyHighlight('hl-pink')" class="w-5 h-5 rounded-full bg-pink-300 hover:scale-110 border border-white/50 transition"></button>
          <div class="h-3.5 w-px bg-slate-700 mx-0.5"></div>
          <button onclick="removeSelectedHighlight()" class="text-rose-400 hover:text-rose-300 text-xs flex items-center gap-1 px-1">
            <i class="fa-solid fa-trash-can text-[11px]"></i> Xóa
          </button>
        </div>

        <!-- Hướng dẫn nhanh dùng bút highlight -->
        <div class="text-[11px] text-slate-400 mb-1 flex items-center gap-1.5 px-1">
          <i class="fa-solid fa-highlighter text-amber-500"></i> 
          <span>Mẹo: Dùng chuột <strong>bôi đen chữ</strong> trong bài để chọn màu đánh dấu tiện lợi.</span>
        </div>

        <!-- Nội dung Passage -->
        <div id="passage-container" class="overflow-y-auto pr-2 custom-scrollbar space-y-4 text-slate-700 text-sm leading-relaxed select-text">
          <!-- Render tự động qua JS -->
        </div>
      </section>

      <!-- CỘT PHẢI: Tabs Quiz & Từ Vựng -->
      <section class="xl:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[calc(100vh-100px)] sticky top-20 overflow-hidden">
        <!-- Tab Headers -->
        <div class="flex border-b border-slate-200 bg-slate-50">
          <button id="tab-btn-quiz" onclick="switchTab('quiz')" class="flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-indigo-600 text-indigo-700 flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-list-check"></i> Câu Hỏi & Bài Làm
          </button>
          <button id="tab-btn-vocab" onclick="switchTab('vocab')" class="flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-book-bookmark"></i> Từ Vựng & Paraphrase
          </button>
        </div>

        <!-- Tab 1: Quiz Form -->
        <div id="tab-quiz" class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-4">
          <div id="quiz-instruction" class="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-lg text-xs text-amber-900 leading-snug">
            <!-- Instruction text -->
          </div>
          <form id="reading-quiz" onsubmit="submitQuiz(event)" class="space-y-4">
            <div id="questions-list" class="space-y-4">
              <!-- Render câu hỏi -->
            </div>
            <div class="flex items-center gap-2 pt-2">
              <button type="submit" class="flex-1 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition text-xs flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i> Nộp Bài & Xem Giải Thích
              </button>
              <button type="button" onclick="resetCurrentQuiz()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition">
                <i class="fa-solid fa-rotate-right"></i>
              </button>
            </div>
          </form>
        </div>

        <!-- Tab 2: Vocab & Paraphrase -->
        <div id="tab-vocab" class="hidden flex-1 overflow-y-auto p-4 custom-scrollbar space-y-5">
          <div id="vocab-content" class="space-y-3">
            <!-- Render danh sách từ vựng -->
          </div>
          <div id="para-content" class="space-y-3 pt-3 border-t border-slate-200">
            <!-- Render bảng Paraphrase -->
          </div>
        </div>

      </section>

    </main>

  </div>

  <!-- SCRIPT DATA & APP LOGIC -->
  <script>
    // TOÀN BỘ 18 BÀI TẬP VỚI ĐẦY ĐỦ TỪ VỰNG & BẢNG PARAPHRASE CHUẨN XÁC
    const ACTIVITIES = [
      {
        id: 1,
        part: "01. SENTENCE COMPLETION",
        title: "Activity 1: AMAZING HOMES",
        instruction: "Complete the sentences. Choose NO MORE THAN TWO WORDS from the passage for each answer.",
        passage: [
          { en: "Most people live in a house or a flat. When they go on holiday they stay in a hotel or a guest house. But some places where you can live or stay are a bit different.", vi: "Hầu hết mọi người sống trong một ngôi nhà hoặc căn hộ. Khi đi nghỉ, họ thường ở khách sạn hoặc nhà nghỉ. Nhưng một số nơi mà bạn có thể sinh sống hoặc lưu trú lại có phần khác biệt." },
          { en: "A. One unusual place to live is a houseboat. Amsterdam in Holland is famous for its houseboats - there are about 2,500 of them. They have everything that normal houses have: a living room, bedroom, kitchen, bathroom and even sometimes a terrace on the roof. They are cheaper than houses and people who live on houseboats enjoy being close to nature. Some houseboats can be moved to other parts of the river, while others are permanently in one place.", vi: "A. Một nơi ở khác thường là nhà thuyền. Amsterdam ở Hà Lan nổi tiếng với những ngôi nhà thuyền – có khoảng 2.500 ngôi nhà như vậy. Chúng có mọi thứ mà những ngôi nhà bình thường có: phòng khách, phòng ngủ, nhà bếp, phòng tắm và đôi khi thậm chí còn có cả sân thượng trên mái. Nhà thuyền rẻ hơn nhà ở thông thường và những người sống trên đó thích cảm giác được gần gũi với thiên nhiên..." },
          { en: "B. In Tokyo, Japan, there is a see-through house. It is like a normal Japanese house but all the walls are made of glass. There is plenty of daylight but no privacy. Architect Sou Fujimoto designed it for a couple to make their home. He based his idea on early man living in trees. It wouldn't suit everyone but the couple who live there love the feeling of being surrounded by the natural world.", vi: "B. Ở Tokyo, Nhật Bản, có một ngôi nhà trong suốt. Nó giống như một ngôi nhà bình thường của Nhật Bản, nhưng tất cả các bức tường đều được làm bằng kính. Ngôi nhà có rất nhiều ánh sáng tự nhiên nhưng lại không có sự riêng tư. Kiến trúc sư Sou Fujimoto đã thiết kế ngôi nhà này cho một cặp vợ chồng. Kiểu nhà này không phù hợp với tất cả mọi người, nhưng cặp vợ chồng sống ở đó rất thích cảm giác được bao quanh bởi thế giới tự nhiên." },
          { en: "C. All around the world, people live in homes made from shipping containers. Some use only one container, while others are made from several containers joined together. One house in Chile was built from 12 containers. They are cheap to buy and eco-friendly. They can also be placed in the garden or drive as guest rooms, studies or utility rooms.", vi: "C. Trên khắp thế giới, mọi người sống trong những ngôi nhà được làm từ container vận chuyển hàng hóa. Một số ngôi nhà chỉ sử dụng một container, trong khi những ngôi nhà khác được làm từ nhiều container ghép lại với nhau. Một ngôi nhà ở Chile được xây dựng từ 12 container. Những container này có giá mua rẻ và thân thiện với môi trường." },
          { en: "D. In Germany, you can stay in a one-metre-square house, the smallest house in the world, called the House NA. Van Bo Le-Mentzel, a refugee from Laos, built it to draw attention to the world housing shortage. It is a wooden structure on wheels and weighs 40 kg. It has a locking door and window. You can turn it onto its side when you want to lie down. Franz from Munich spent the night in one recently 'just to see what it was like'. He found it a bit uncomfortable!", vi: "D. Ở Đức, bạn có thể ở trong một ngôi nhà rộng một mét vuông, ngôi nhà nhỏ nhất thế giới, được gọi là House NA. Van Bo Le-Mentzel, một người tị nạn đến từ Lào, đã xây dựng ngôi nhà này nhằm thu hút sự chú ý đến tình trạng thiếu nhà ở trên thế giới. Đây là một công trình bằng gỗ có bánh xe và nặng 40 kg..." },
          { en: "E. For an unusual holiday you can stay in an igloo, a house made of ice. These can be found in several countries including Sweden, Norway and Finland. They are built new every winter. Jenny and Callum, visitors from Australia, told us, 'We slept in an igloo last night. It's so cold there - minus 5 degrees centigrade. We used reindeer skins to keep warm.'", vi: "E. Để có một kỳ nghỉ khác thường, bạn có thể ở trong lều tuyết, một ngôi nhà làm bằng băng. Những ngôi nhà như vậy có thể được tìm thấy ở Thụy Điển, Na Uy và Phần Lan. Jenny và Callum kể lại: 'Ở đó lạnh đến mức nhiệt độ xuống tới âm 5 độ C. Chúng tôi đã dùng da tuần lộc để giữ ấm.'" },
          { en: "F. Another couple, Shaun and Rachel from Manchester, enjoyed a recent holiday in a treehouse in Sussex, England. They said, 'It was right up in the trees and had everything we needed, even wifi! It had a small kitchen and we did our own cooking. It was the perfect place to get away from our busy lives.'", vi: "F. Một cặp đôi khác, Shaun và Rachel, đã tận hưởng kỳ nghỉ trong một ngôi nhà trên cây ở Sussex, Anh. Họ cho biết: 'Nó có một căn bếp nhỏ và chúng tôi tự nấu ăn. Đây là nơi hoàn hảo để rời xa cuộc sống bận rộn của mình.'" }
        ],
        questions: [
          { q: "1. The two people who live in the transparent house love it, but it wouldn't _______", ans: ["suit everyone"], loc: "Đoạn B: 'It wouldn't suit everyone but the couple who live there love...'", exp: "Đoạn B chỉ rõ ngôi nhà kính trong suốt này không phù hợp với tất cả mọi người ('suit everyone')." },
          { q: "2. The designer of the smallest house hopes to _______ to the lack of houses all over the world.", ans: ["draw attention"], loc: "Đoạn D: '...built it to draw attention to the world housing shortage.'", exp: "'draw attention' có nghĩa là thu hút sự chú ý đến vấn đề thiếu nhà ở." },
          { q: "3. People who stay in igloos sometimes protect themselves from the cold by making use of _______", ans: ["reindeer skins"], loc: "Đoạn E: 'We used reindeer skins to keep warm.'", exp: "Họ sử dụng da tuần lộc ('reindeer skins') để giữ ấm cơ thể trong lều băng tuyết." },
          { q: "4. People who have _______ would find a holiday in a treehouse ideal.", ans: ["busy lives"], loc: "Đoạn F: 'It was the perfect place to get away from our busy lives.'", exp: "Ngôi nhà trên cây là nơi lý tưởng để thoát khỏi nhịp sống bận rộn ('busy lives')." }
        ],
        vocab: [
          { word: "see-through", type: "adj", ipa: "/ˈsiː.θruː/", def: "Trong suốt, nhìn xuyên qua được", ex: "The modern house has see-through glass walls.", viEx: "Ngôi nhà hiện đại có những bức tường kính trong suốt." },
          { word: "shortage", type: "n", ipa: "/ˈʃɔː.tɪdʒ/", def: "Sự thiếu hụt, tình trạng khan hiếm", ex: "The city faces a severe housing shortage.", viEx: "Thành phố đang đối mặt với tình trạng thiếu hụt nhà ở trầm trọng." },
          { word: "permanently", type: "adv", ipa: "/ˈpɜː.mə.nənt.li/", def: "Cố định, lâu dài, vĩnh viễn", ex: "Some houseboats are anchored permanently in one place.", viEx: "Một số nhà thuyền được neo đậu cố định ở một nơi." },
          { word: "eco-friendly", type: "adj", ipa: "/ˌiː.kəʊˈfrend.li/", def: "Thân thiện với môi trường sinh thái", ex: "Container homes are considered cheap and eco-friendly.", viEx: "Nhà làm từ container được xem là rẻ và thân thiện với môi trường." }
        ],
        paraphrase: [
          { pair: "transparent house <-> see-through house", mean: "Ngôi nhà trong suốt nhìn thấu được", exEn: "The transparent structure allowed natural light to flood in.", exVi: "Cấu trúc trong suốt giúp ánh sáng tự nhiên tràn ngập khắp nơi." },
          { pair: "lack of houses <-> housing shortage", mean: "Tình trạng thiếu thốn chỗ ở", exEn: "A chronic lack of houses forced prices up.", exVi: "Tình trạng thiếu nhà kinh niên đã đẩy giá tăng cao." },
          { pair: "draw attention to <-> highlight / raise awareness", mean: "Thu hút sự chú ý / nâng cao nhận thức", exEn: "The exhibition draws attention to climate change.", exVi: "Triển lãm thu hút sự chú ý tới biến đổi khí hậu." }
        ]
      },
      {
        id: 2,
        part: "01. SENTENCE COMPLETION",
        title: "Activity 2: HOME FROM HOME",
        instruction: "Read the passage and complete the sentences below. Choose NO MORE THAN THREE WORDS from the passage for each answer.",
        passage: [
          { en: "I remember feeling the first time I left home that I would never be able to feel at home anywhere but in my home. No other place would have my mum and dad, my annoying little brother and my cat, Tilly. Nowhere would smell like my home – my mum's roast chicken in the oven and the salty, seaweed smell that drifted in from the nearby beach. The sound of seagulls squawking was the sound of home. Nowhere else would I feel comfortable enough to put my feet up under me and gaze into the log fire dreaming of the future.", vi: "Tôi nhớ lần đầu tiên rời khỏi nhà, tôi đã cảm thấy rằng mình sẽ không bao giờ có thể cảm thấy thoải mái như ở nhà khi ở bất kỳ nơi nào khác. Không nơi nào khác có mẹ và bố đáng yêu của tôi, em trai tôi và chú mèo Tilly. Mùi món gà quay của mẹ trong lò nướng và mùi mằn mặn của rong biển..." },
          { en: "I was 15 when I first went away from home on a school trip to Germany. My friends were going too, but we would all stay with different families. I was nervous about this. I knew the home I was going to would not be as comfortable as mine, the family would not be as kind, and who knew what the German food would be like? I knew I would spend three weeks, homesick and sad, missing my family back home.", vi: "Tôi 15 tuổi khi lần đầu tiên xa nhà trong một chuyến đi của trường tới Đức. Tôi rất lo lắng về điều này. Tôi biết mình sẽ phải trải qua ba tuần nhớ nhà và buồn bã, nhớ gia đình ở quê nhà." },
          { en: "We arrived in Germany late at night after a long journey by coach and boat. I was tired and hungry. We went into the school hall, where the host families were waiting to meet us. I wondered which one would be mine. Would they give me dinner at this time and would I be able to eat the unfamiliar food? Suddenly I heard my name called and the name of my exchange partner, Brigitte Schmitt. A pretty, blonde girl stepped forward, smiling widely. Behind her stood her parents, a pleasant-looking couple who were also smiling. They held out their hands and said, 'Wilkommen in Deutschland. Welcome to Germany.'", vi: "Chúng tôi đến Đức vào đêm muộn sau một hành trình dài. Đột nhiên tôi nghe thấy tên mình được gọi cùng với tên bạn học trao đổi Brigitte Schmitt. Một cô gái tóc vàng xinh xắn bước tới, phía sau là bố mẹ cô ấy..." },
          { en: "I spent three happy weeks with the Schmitt family. Brigitte had an elder brother, Hendrik, and a younger sister, Lisa. They had two cats, Ping and Pong, who sat on my lap as I looked into the fire in the evenings. The whole family were kind and welcoming. My room was cosy and warm and we looked out onto a forest. The fresh clean smell of the trees and of apples baking in the oven became familiar and comforting, like the smells of home. I learnt in those three weeks that you can feel at home anywhere that people are kind to you.", vi: "Tôi đã trải qua ba tuần vui vẻ cùng gia đình Schmitt. Họ có 2 chú mèo tên là Ping và Pong. Căn phòng của tôi ấm cúng và nhìn ra một khu rừng. Tôi nhận ra ta có thể thấy như ở nhà ở bất cứ nơi đâu mọi người tử tế với mình." },
          { en: "Later that year, Brigitte came to stay with me in the UK. I gave her my room and moved in with my brother. I cleared space for her clothes and put fresh flowers in a vase by the bed. I asked my mum to make her famous roast chicken and an apple pie to make our guest feel at home. We made a welcome banner and put it up on the front door. I did everything I could to help Brigitte feel at home with us. I now understood the importance of a warm welcome.", vi: "Cuối năm đó, Brigitte đến ở cùng tôi tại Anh. Tôi dọn phòng, cắm hoa và nhờ mẹ nướng món gà quay nổi tiếng để bạn cảm thấy như ở nhà. Giờ đây tôi đã thấu hiểu tầm quan trọng của một lời chào đón ấm áp." }

          { en: "B. In 1944, education was divided into three parts... In practice, however, only 0.5% went to technical schools... The system did not produce good results, and changed to a more equal system in the 1970s.", vi: "B. Hệ thống năm 1944 không đem lại kết quả tốt (was not a great success)." },
          { en: "E. Blended learning means part of the course can be delivered online, so people don't have to miss work to go to classes.", vi: "E. Học tập kết hợp online giúp người đi làm không cần nghỉ việc mà vẫn học được (tiện lợi cho người lao động)." },
          { en: "F. There are some challenges: difficult to find teachers who can teach in different places and at different times.", vi: "F. Thách thức lớn là việc thu xếp thời gian và địa điểm giảng dạy." }
        ],
        questions: [
          { q: "1. Apprenticeships: A are a new way, B were common in the past, C only existed in past, D did not help.", ans: ["b"], loc: "Đoạn A: 'apprenticeships were a common way of learning in the past.'", exp: "1 - B: Học nghề từng là phương thức học tập phổ biến trong quá khứ." },
          { q: "2. The education system introduced in 1944: A only affected 0.5%, B taught only technical, C was not a great success, D for gifted.", ans: ["c"], loc: "Đoạn B: 'The system did not produce good results'", exp: "2 - C: Hệ thống năm 1944 không gặt hái được thành công lớn." },
          { q: "3. Blended learning: A benefits only retired, B mainly face to face, C mainly nursing, D is convenient for working people.", ans: ["d"], loc: "Đoạn E: 'people don't have to miss work to go to classes' -> convenient", exp: "3 - D: Rất thuận tiện cho những ai đang đi làm bận rộn." },
          { q: "4. The challenges of work-based learning include: A practical issues like when classes are held, B inexperienced students, C acceptable learning, D computer illiteracy.", ans: ["a"], loc: "Đoạn F: 'teach in different places and at different times'", exp: "4 - A: Những vấn đề thực tế như khung giờ và địa điểm tổ chức lớp học." }
        ],
        vocab: [
          { word: "apprenticeship", type: "n", ipa: "/əˈpren.tɪs.ʃɪp/", def: "Sự học nghề, chế độ tập việc", ex: "He signed up for a plumbing apprenticeship.", viEx: "Anh ấy đã đăng ký một khóa học nghề thợ sửa ống nước." }
        ],
        paraphrase: [
          { pair: "did not produce good results <-> was not a great success", mean: "Không đem lại thành tựu lớn", exEn: "The pilot campaign was not a great success.", exVi: "Chiến dịch thử nghiệm đã không thu về thành công lớn." }
        ]
      }
    ];

    // Trạng thái ứng dụng
    let currentActIndex = 0;
    let isTranslated = false;
    let isPlaying = false;
    let synth = window.speechSynthesis;
    let utterance = null;
    let currentSelectedRange = null;

    // Khởi tạo Sidebar Menu
    function initSidebar() {
      const menuContainer = document.getElementById('activity-menu');
      menuContainer.innerHTML = '';

      let lastPart = "";
      ACTIVITIES.forEach((act, idx) => {
        if (act.part !== lastPart) {
          lastPart = act.part;
          const header = document.createElement('div');
          header.className = "pt-2 pb-1 px-2 font-bold text-[10px] uppercase tracking-wider text-indigo-700 bg-indigo-50/50 rounded mt-1";
          header.textContent = act.part;
          menuContainer.appendChild(header);
        }

        const btn = document.createElement('button');
        btn.id = `nav-btn-${idx}`;
        btn.onclick = () => selectActivity(idx);
        btn.className = `w-full text-left px-3 py-2 rounded-lg font-medium transition flex items-center justify-between gap-1 text-slate-700 hover:bg-slate-100 ${idx === currentActIndex ? 'bg-indigo-600 !text-white shadow-sm font-bold' : ''}`;
        btn.innerHTML = `
          <span class="truncate">${act.title}</span>
          <i class="fa-solid fa-chevron-right text-[10px] opacity-70"></i>
        `;
        menuContainer.appendChild(btn);
      });
    }

    // Tải bài học
    function selectActivity(index) {
      currentActIndex = index;
      const act = ACTIVITIES[index];

      if (isPlaying) toggleAudio();
      hideHighlightToolbar();

      document.getElementById('top-title').textContent = act.title;
      document.getElementById('top-subtitle').textContent = act.part;

      document.querySelectorAll('#activity-menu button').forEach((btn, idx) => {
        if (idx === index) {
          btn.className = "w-full text-left px-3 py-2 rounded-lg font-bold transition flex items-center justify-between gap-1 bg-indigo-600 text-white shadow-sm";
        } else {
          btn.className = "w-full text-left px-3 py-2 rounded-lg font-medium transition flex items-center justify-between gap-1 text-slate-700 hover:bg-slate-100";
        }
      });

      const sidebar = document.getElementById('sidebar');
      if (!sidebar.classList.contains('-translate-x-full')) {
        toggleSidebar();
      }

      // Render Passage
      const pContainer = document.getElementById('passage-container');
      pContainer.innerHTML = `
        <div class="text-center pb-2 border-b border-slate-100">
          <h2 class="text-lg md:text-xl font-extrabold text-slate-900 tracking-tight">${act.title}</h2>
          <span class="text-[11px] text-indigo-600 uppercase tracking-widest font-semibold">${act.part}</span>
        </div>
      `;

      act.passage.forEach((p) => {
        const block = document.createElement('div');
        block.className = "passage-block p-2.5 rounded-xl transition hover:bg-slate-50/80 border border-transparent hover:border-slate-100";
        block.innerHTML = `
          <p class="en-text font-serif leading-relaxed">${p.en}</p>
          <div class="vn-text ${isTranslated ? '' : 'hidden'} mt-2 p-2.5 bg-indigo-50/70 border-l-4 border-indigo-500 rounded-r-lg text-xs md:text-sm text-indigo-950 font-sans">
            <span class="font-bold text-[10px] uppercase tracking-wide text-indigo-700 block mb-0.5">Bản dịch tiếng Việt:</span>
            ${p.vi}
          </div>
        `;
        pContainer.appendChild(block);
      });

      // Render Questions
      document.getElementById('quiz-instruction').innerHTML = `
        <p class="font-bold uppercase tracking-wider text-[11px] mb-0.5"><i class="fa-solid fa-circle-info"></i> Yêu cầu đề bài:</p>
        <p>${act.instruction}</p>
      `;

      const qContainer = document.getElementById('questions-list');
      qContainer.innerHTML = '';
      act.questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = "question-card p-3 rounded-xl border border-slate-200 bg-white transition";
        card.setAttribute('data-qid', qIdx);

        card.innerHTML = `
          <label class="block text-xs md:text-sm font-semibold text-slate-800 leading-snug mb-2">
            ${q.q}
          </label>
          <input type="text" id="ans-${qIdx}" class="w-full px-3 py-1.5 text-xs md:text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition" placeholder="Nhập đáp án...">
          <div id="fb-${qIdx}" class="hidden mt-2 p-2.5 rounded-lg text-xs leading-relaxed"></div>
        `;
        qContainer.appendChild(card);
      });

      // Render Vocab
      const vContainer = document.getElementById('vocab-content');
      vContainer.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-slate-800 text-xs md:text-sm flex items-center gap-1.5">
            <i class="fa-solid fa-spell-check text-indigo-600"></i> Từ Vựng Trọng Tâm
          </h3>
          <span class="text-[10px] bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium">${act.vocab ? act.vocab.length : 0} từ</span>
        </div>
      `;

      if (act.vocab && act.vocab.length > 0) {
        act.vocab.forEach(v => {
          const vBox = document.createElement('div');
          vBox.className = "p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-1";
          vBox.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-bold text-indigo-900">${v.word}</span>
              <span class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-mono">${v.type}${v.ipa}</span>
            </div>
            <p class="text-slate-700"><span class="font-semibold text-slate-900">Nghĩa:</span> ${v.def}</p>
            <p class="text-slate-500 italic">"${v.ex}" (${v.viEx})</p>
          `;
          vContainer.appendChild(vBox);
        });
      }

      // Render Paraphrase
      const pTable = document.getElementById('para-content');
      pTable.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-slate-800 text-xs md:text-sm flex items-center gap-1.5">
            <i class="fa-solid fa-arrows-rotate text-emerald-600"></i> Bảng Paraphrase Đối Chiếu
          </h3>
          <span class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-medium">Chi tiết</span>
        </div>
      `;

      if (act.paraphrase && act.paraphrase.length > 0) {
        act.paraphrase.forEach((pr, pIdx) => {
          const pBox = document.createElement('div');
          pBox.className = "p-2.5 rounded-xl border border-emerald-100 bg-emerald-50/30 text-xs space-y-1";
          pBox.innerHTML = `
            <div class="flex items-center justify-between font-semibold text-slate-800">
              <div>${pr.pair}</div>
              <button type="button" onclick="toggleParaEx('pex-${pIdx}')" class="text-indigo-600 hover:text-indigo-800 text-[10px] font-bold">
                Ví dụ <i class="fa-solid fa-chevron-down"></i>
              </button>
            </div>
            <p class="text-slate-600"><span class="font-semibold">Nghĩa:</span> ${pr.mean}</p>
            <div id="pex-${pIdx}" class="hidden mt-1 pt-1.5 border-t border-emerald-100 text-slate-600 italic">
              - EN: ${pr.exEn}<br>
              - VI: ${pr.exVi}
            </div>
          `;
          pTable.appendChild(pBox);
        });
      }

      document.getElementById('score-badge').classList.add('hidden');
    }

    // Toggle Sidebar trên Mobile
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    }

    // Switch Tabs
    function switchTab(tab) {
      const qTab = document.getElementById('tab-quiz');
      const vTab = document.getElementById('tab-vocab');
      const qBtn = document.getElementById('tab-btn-quiz');
      const vBtn = document.getElementById('tab-btn-vocab');

      if (tab === 'quiz') {
        qTab.classList.remove('hidden');
        vTab.classList.add('hidden');
        qBtn.className = "flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-indigo-600 text-indigo-700 flex items-center justify-center gap-1.5 transition";
        vBtn.className = "flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5 transition";
      } else {
        vTab.classList.remove('hidden');
        qTab.classList.add('hidden');
        vBtn.className = "flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-indigo-600 text-indigo-700 flex items-center justify-center gap-1.5 transition";
        qBtn.className = "flex-1 py-3 px-2 text-center font-bold text-xs md:text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center justify-center gap-1.5 transition";
      }
    }

    // Toggle bản dịch
    function toggleTranslation() {
      isTranslated = !isTranslated;
      const transBlocks = document.querySelectorAll('.vn-text');
      transBlocks.forEach(el => {
        if (isTranslated) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
      document.getElementById('trans-btn-text').textContent = isTranslated ? "Ẩn Bản Dịch" : "Xem Bản Dịch";
    }

    function toggleParaEx(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('hidden');
    }

    // ==========================================
    // CÔNG CỤ BÚT DẠ HIGHLIGHT CHUỘT THÔNG MINH
    // ==========================================
    const passageContainer = document.getElementById('passage-container');
    const highlightToolbar = document.getElementById('highlight-toolbar');

    document.addEventListener('mouseup', function (e) {
      const selection = window.getSelection();
      if (!selection.isCollapsed && selection.rangeCount > 0) {
        const range = selection.getRangeAt(0);
        // Đảm bảo chỉ bắt sự kiện khi bôi đen trong khu vực bài đọc
        if (passageContainer.contains(range.commonAncestorContainer)) {
          const rect = range.getBoundingClientRect();
          const containerRect = passageContainer.parentElement.getBoundingClientRect();

          currentSelectedRange = range.cloneRange();

          // Định vị trí tooltip nổi ngay phía trên vùng bôi đen
          const topPos = rect.top - containerRect.top - 42;
          const leftPos = Math.max(10, rect.left - containerRect.left + (rect.width / 2) - 100);

          highlightToolbar.style.top = `${topPos}px`;
          highlightToolbar.style.left = `${leftPos}px`;
          highlightToolbar.classList.remove('hidden');
          return;
        }
      }
      
      // Nếu click ra ngoài thanh toolbar thì ẩn
      if (!highlightToolbar.contains(e.target)) {
        hideHighlightToolbar();
      }
    });

    function hideHighlightToolbar() {
      highlightToolbar.classList.add('hidden');
      currentSelectedRange = null;
    }

    function applyHighlight(colorClass) {
      if (!currentSelectedRange) return;

      const span = document.createElement('span');
      span.className = colorClass;
      try {
        span.appendChild(currentSelectedRange.extractContents());
        currentSelectedRange.insertNode(span);
      } catch (err) {
        console.error("Không thể highlight vùng chọn phức tạp:", err);
      }

      window.getSelection().removeAllRanges();
      hideHighlightToolbar();
    }

    function removeSelectedHighlight() {
      if (!currentSelectedRange) return;
      const common = currentSelectedRange.commonAncestorContainer;
      const parentSpan = common.nodeType === 1 ? common : common.parentElement;

      if (parentSpan && (parentSpan.classList.contains('hl-yellow') || parentSpan.classList.contains('hl-green') || parentSpan.classList.contains('hl-cyan') || parentSpan.classList.contains('hl-pink'))) {
        const parent = parentSpan.parentNode;
        while (parentSpan.firstChild) {
          parent.insertBefore(parentSpan.firstChild, parentSpan);
        }
        parent.removeChild(parentSpan);
      }
      window.getSelection().removeAllRanges();
      hideHighlightToolbar();
    }

    function clearAllHighlights() {
      if (!confirm("Bạn có chắc chắn muốn xóa toàn bộ các dấu highlight trong bài này không?")) return;
      const marks = passageContainer.querySelectorAll('.hl-yellow, .hl-green, .hl-cyan, .hl-pink');
      marks.forEach(span => {
        const parent = span.parentNode;
        while (span.firstChild) {
          parent.insertBefore(span.firstChild, span);
        }
        parent.removeChild(span);
      });
      hideHighlightToolbar();
    }

    // TTS AI Reader
    function toggleAudio() {
      if (!synth) {
        alert("Trình duyệt không hỗ trợ Web Speech AI!");
        return;
      }
      const icon = document.getElementById('audio-icon');
      const text = document.getElementById('audio-text');
      const rate = parseFloat(document.getElementById('audio-rate').value) || 1.0;

      if (isPlaying) {
        synth.cancel();
        isPlaying = false;
        icon.className = "fa-solid fa-play";
        text.textContent = "Audio AI";
      } else {
        synth.cancel();
        const paras = document.querySelectorAll('#passage-container .en-text');
        let fullText = ACTIVITIES[currentActIndex].title + ". ";
        paras.forEach(p => fullText += p.innerText + " ");

        utterance = new SpeechSynthesisUtterance(fullText);
        utterance.lang = 'en-US';
        utterance.rate = rate;

        utterance.onend = () => {
          isPlaying = false;
          icon.className = "fa-solid fa-play";
          text.textContent = "Audio AI";
        };
        utterance.onerror = () => {
          isPlaying = false;
          icon.className = "fa-solid fa-play";
          text.textContent = "Audio AI";
        };

        synth.speak(utterance);
        isPlaying = true;
        icon.className = "fa-solid fa-stop";
        text.textContent = "Dừng";
      }
    }

    function cleanStr(s) {
      return (s || "").trim().toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ");
    }

    // Nộp bài & Hiển thị giải thích
    function submitQuiz(e) {
      e.preventDefault();
      const act = ACTIVITIES[currentActIndex];
      let correctCount = 0;
      const total = act.questions.length;

      act.questions.forEach((q, idx) => {
        const input = document.getElementById(`ans-${idx}`);
        const userVal = cleanStr(input.value);
        const fb = document.getElementById(`fb-${idx}`);

        const isCorrect = q.ans.some(a => cleanStr(a) === userVal);

        fb.classList.remove('hidden');

        if (isCorrect && userVal !== '') {
          correctCount++;
          input.className = "w-full px-3 py-1.5 text-xs md:text-sm border-2 border-emerald-500 bg-emerald-50 text-emerald-900 rounded-lg focus:outline-none";
          fb.className = "mt-2 p-2.5 rounded-lg text-xs leading-relaxed bg-emerald-50 border border-emerald-200 text-emerald-950";
          fb.innerHTML = `
            <div class="font-bold flex items-center gap-1 text-emerald-700">
              <i class="fa-solid fa-circle-check"></i> Chính xác!
            </div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Vị trí:</span> ${q.loc}</div>
            <div class="mt-0.5"><span class="font-semibold text-slate-700">Giải thích:</span> ${q.exp}</div>
          `;
        } else {
          input.className = "w-full px-3 py-1.5 text-xs md:text-sm border-2 border-rose-500 bg-rose-50 text-rose-900 rounded-lg focus:outline-none";
          fb.className = "mt-2 p-2.5 rounded-lg text-xs leading-relaxed bg-rose-50 border border-rose-200 text-rose-950";
          fb.innerHTML = `
            <div class="font-bold flex items-center gap-1 text-rose-700">
              <i class="fa-solid fa-circle-xmark"></i> Chưa chính xác!
            </div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Đáp án chuẩn:</span> <strong class="text-rose-800 uppercase font-mono">${q.ans[0]}</strong></div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Vị trí:</span> ${q.loc}</div>
            <div class="mt-0.5"><span class="font-semibold text-slate-700">Giải thích:</span> ${q.exp}</div>
          `;
        }
      });

      const badge = document.getElementById('score-badge');
      const display = document.getElementById('score-display');
      badge.classList.remove('hidden');
      display.textContent = `${correctCount}/${total}`;

      document.querySelector('[data-qid="0"]').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Reset bài làm
    function resetCurrentQuiz() {
      const act = ACTIVITIES[currentActIndex];
      act.questions.forEach((q, idx) => {
        const input = document.getElementById(`ans-${idx}`);
        input.value = '';
        input.className = "w-full px-3 py-1.5 text-xs md:text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition";
        const fb = document.getElementById(`fb-${idx}`);
        fb.className = "hidden mt-2 p-2.5 rounded-lg text-xs leading-relaxed";
        fb.innerHTML = '';
      });
      document.getElementById('score-badge').classList.add('hidden');
    }

    // Khởi động trang web
    window.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      selectActivity(0);
    });
  </script>
</body>
</html>
