    <!-- CỘT PHẢI: CÂU HỎI & PARAPHRASE / TỪ VỰNG (5/12 cột) -->

        <div class="flex items-center gap-1.5">

            <i class="fa-solid fa-highlighter text-amber-500"></i> Bút câu hỏi:

          <div class="flex items-center gap-1.5">
            <button onclick="applyHighlight('hl-yellow')" class="w-5 h-5 rounded-full bg-yellow-300 hover:scale-110 active:scale-95 border border-slate-300 shadow-sm transition" title="Tô Vàng"></button>
            <button onclick="applyHighlight('hl-green')" class="w-5 h-5 rounded-full bg-emerald-300 hover:scale-110 active:scale-95 border border-slate-300 shadow-sm transition" title="Tô Xanh lá"></button>
            <button onclick="applyHighlight('hl-cyan')" class="w-5 h-5 rounded-full bg-sky-300 hover:scale-110 active:scale-95 border border-slate-300 shadow-sm transition" title="Tô Xanh ngọc"></button>
            <button onclick="applyHighlight('hl-pink')" class="w-5 h-5 rounded-full bg-pink-300 hover:scale-110 active:scale-95 border border-slate-300 shadow-sm transition" title="Tô Hồng"></button>

        <button onclick="applyHighlight('hl-cyan')" class="w-4 h-4 rounded-full bg-sky-300 hover:scale-110 border border-white/50 transition"></button>

      <!-- Tab 1: Quiz Form -->

  <!-- SCRIPT DỮ LIỆU ĐẦY ĐỦ 18 ACTIVITIES & FULL TỪ VỰNG AME -->
  <script>
    const ACTIVITIES = [
      {
        id: 1,
        part: "01. DẠNG BÀI SENTENCE COMPLETION",
        title: "Activity 1: AMAZING HOMES",
        instruction: "Complete the sentences. Choose NO MORE THAN TWO WORDS from the passage for each answer.",
        passage: [
          { en: "Most people live in a house or a flat. When they go on holiday they stay in a hotel or a guest house. But some places where you can live or stay are a bit different.", vi: "Hầu hết mọi người sống trong một ngôi nhà hoặc căn hộ. Khi đi nghỉ, họ thường ở khách sạn hoặc nhà nghỉ. Nhưng một số nơi mà bạn có thể sinh sống hoặc lưu trú lại có phần khác biệt." },
          { en: "A One unusual place to live is a houseboat. Amsterdam in Holland is famous for its houseboats - there are about 2,500 of them. They have everything that normal houses have: a living room, bedroom, kitchen, bathroom and even sometimes a terrace on the roof. They are cheaper than houses and people who live on houseboats enjoy being close to nature. Some houseboats can be moved to other parts of the river, while others are permanently in one place.", vi: "A Một nơi ở khác thường là nhà thuyền. Amsterdam ở Hà Lan nổi tiếng với những ngôi nhà thuyền – có khoảng 2.500 ngôi nhà như vậy. Chúng có mọi thứ mà những ngôi nhà bình thường có: phòng khách, phòng ngủ, nhà bếp, phòng tắm và đôi khi thậm chí còn có cả sân thượng trên mái. Nhà thuyền rẻ hơn nhà ở thông thường và những người sống trên đó thích cảm giác được gần gũi với thiên nhiên. Một số nhà thuyền có thể được di chuyển đến những khu vực khác của dòng sông, trong khi những ngôi nhà khác được neo cố định tại một chỗ." },
          { en: "B In Tokyo, Japan, there is a see-through house. It is like a normal Japanese house but all the walls are made of glass. There is plenty of daylight but no privacy. Architect Sou Fujimoto designed it for a couple to make their home. He based his idea on early man living in trees. It wouldn't suit everyone but the couple who live there love the feeling of being surrounded by the natural world.", vi: "B Ở Tokyo, Nhật Bản, có một ngôi nhà trong suốt. Nó giống như một ngôi nhà bình thường của Nhật Bản, nhưng tất cả các bức tường đều được làm bằng kính. Ngôi nhà có rất nhiều ánh sáng tự nhiên nhưng lại không có sự riêng tư. Kiến trúc sư Sou Fujimoto đã thiết kế ngôi nhà này cho một cặp vợ chồng. Ông lấy cảm hứng từ ý tưởng về những người thời kỳ đầu sống trên cây. Kiểu nhà này không phù hợp với tất cả mọi người, nhưng cặp vợ chồng sống ở đó rất thích cảm giác được bao quanh bởi thế giới tự nhiên." },
          { en: "C All around the world, people live in homes made from shipping containers. Some use only one container, while others are made from several containers joined together. One house in Chile was built from 12 containers. They are cheap to buy and eco-friendly. They can also be placed in the garden or drive as guest rooms, studies or utility rooms.", vi: "C Trên khắp thế giới, mọi người sống trong những ngôi nhà được làm từ container vận chuyển hàng hóa. Một số ngôi nhà chỉ sử dụng một container, trong khi những ngôi nhà khác được làm từ nhiều container ghép lại với nhau. Một ngôi nhà ở Chile được xây dựng từ 12 container. Những container này có giá mua rẻ và thân thiện với môi trường. Chúng cũng có thể được đặt trong vườn hoặc trên lối xe chạy vào nhà để làm phòng cho khách, phòng làm việc hoặc phòng tiện ích." },
          { en: "D In Germany, you can stay in a one-metre-square house, the smallest house in the world, called the House NA. Van Bo Le-Mentzel, a refugee from Laos, built it to draw attention to the world housing shortage. It is a wooden structure on wheels and weighs 40 kg. It has a locking door and window. You can turn it onto its side when you want to lie down. Franz from Munich spent the night in one recently 'just to see what it was like'. He found it a bit uncomfortable!", vi: "D Ở Đức, bạn có thể ở trong một ngôi nhà rộng một mét vuông, ngôi nhà nhỏ nhất thế giới, được gọi là House NA. Van Bo Le-Mentzel, một người tị nạn đến từ Lào, đã xây dựng ngôi nhà này nhằm thu hút sự chú ý đến tình trạng thiếu nhà ở trên thế giới. Đây là một công trình bằng gỗ có bánh xe và nặng 40 kg. Nó có một cánh cửa có khóa và một cửa sổ. Bạn có thể xoay nó nằm nghiêng khi muốn nằm xuống. Franz đến từ Munich gần đây đã qua đêm trong một ngôi nhà như vậy “chỉ để xem cảm giác sẽ như thế nào”. Anh thấy nó hơi không thoải mái!" },
          { en: "E For an unusual holiday you can stay in an igloo, a house made of ice. These can be found in several countries including Sweden, Norway and Finland. They are built new every winter. Jenny and Callum, visitors from Australia, told us, 'We slept in an igloo last night. It's so cold there - minus 5 degrees centigrade. We used reindeer skins to keep warm.'", vi: "E Để có một kỳ nghỉ khác thường, bạn có thể ở trong lều tuyết, một ngôi nhà làm bằng băng. Những ngôi nhà như vậy có thể được tìm thấy ở một số quốc gia, bao gồm Thụy Điển, Na Uy và Phần Lan. Chúng được xây mới vào mỗi mùa đông. Jenny và Callum, hai du khách đến từ Úc, kể với chúng tôi: “Đêm qua chúng tôi đã ngủ trong một căn lều tuyết. Ở đó lạnh đến mức nhiệt độ xuống tới âm 5 độ C. Chúng tôi đã dùng da tuần lộc để giữ ấm.”" },
          { en: "F Another couple, Shaun and Rachel from Manchester, enjoyed a recent holiday in a treehouse in Sussex, England. They said, 'It was right up in the trees and had everything we needed, even wifi! It had a small kitchen and we did our own cooking. It was the perfect place to get away from our busy lives.'", vi: "F Một cặp đôi khác, Shaun và Rachel đến từ Manchester, đã tận hưởng một kỳ nghỉ gần đây trong một ngôi nhà trên cây ở Sussex, Anh. Họ cho biết: “Ngôi nhà nằm ngay trên cao giữa những tán cây và có mọi thứ chúng tôi cần, thậm chí có cả Wi-Fi. Nó có một căn bếp nhỏ và chúng tôi tự nấu ăn. Đây là nơi hoàn hảo để rời xa cuộc sống bận rộn của mình.”" }

        instruction: "Read the passage and complete the sentences below. Choose NO MORE THAN THREE WORDS from the passage for each answer.",
        passage: [
          { en: "I remember feeling the first time I left home that I would never be able to feel at home anywhere but in my home. No other place would have my mum and dad, my annoying little brother and my cat, Tilly. Nowhere would smell like my home – my mum's roast chicken in the oven and the salty, seaweed smell that drifted in from the nearby beach. The sound of seagulls squawking was the sound of home. Nowhere else would I feel comfortable enough to put my feet up under me and gaze into the log fire dreaming of the future.", vi: "Tôi nhớ lần đầu tiên rời khỏi nhà, tôi đã cảm thấy rằng mình sẽ không bao giờ có thể cảm thấy thoải mái như ở nhà khi ở bất kỳ nơi nào khác. Không nơi nào khác có mẹ và bố đáng yêu của tôi, cậu em trai phiền phức của tôi và chú mèo Tilly. Không nơi nào có mùi giống như ở nhà – mùi món gà quay của mẹ trong lò nướng và mùi mằn mặn của rong biển trôi dạt vào từ bãi biển gần đó. Tiếng chim mòng biển kêu là âm thanh của quê nhà. Không nơi nào khác tôi có thể cảm thấy đủ thoải mái để gác chân lên ghế và ngồi nhìn vào ngọn lửa, mơ về tương lai." },
          { en: "I was 15 when I first went away from home on a school trip to Germany. My friends were going too, but we would all stay with different families. I was nervous about this. I knew the home I was going to would not be as comfortable as mine, the family would not be as kind, and who knew what the German food would be like? I knew I would spend three weeks, homesick and sad, missing my family back home.", vi: "Tôi 15 tuổi khi lần đầu tiên xa nhà trong một chuyến đi của trường tới Đức. Bạn bè tôi cũng đi, nhưng tất cả chúng tôi sẽ ở với những gia đình khác nhau. Tôi rất lo lắng về điều này. Tôi biết ngôi nhà mà mình sắp ở sẽ không thoải mái như nhà mình, gia đình đó sẽ không tử tế bằng gia đình tôi, và ai mà biết được đồ ăn Đức sẽ như thế nào? Tôi biết mình sẽ phải trải qua ba tuần nhớ nhà và buồn bã, nhớ gia đình ở quê nhà." },
          { en: "We arrived in Germany late at night after a long journey by coach and boat. I was tired and hungry. We went into the school hall, where the host families were waiting to meet us. I wondered which one would be mine. Would they give me dinner at this time and would I be able to eat the unfamiliar food? Suddenly I heard my name called and the name of my exchange partner, Brigitte Schmitt. A pretty, blonde girl stepped forward, smiling widely. Behind her stood her parents, a pleasant-looking couple who were also smiling. They held out their hands and said, 'Wilkommen in Deutschland. Welcome to Germany.'", vi: "Chúng tôi đến Đức vào đêm muộn sau một hành trình dài bằng xe khách và tàu thủy. Tôi mệt và đói. Chúng tôi bước vào hội trường của trường, nơi những gia đình chủ nhà đang chờ để gặp chúng tôi. Tôi tự hỏi gia đình nào sẽ là gia đình của mình. Liệu họ có cho tôi ăn tối vào giờ này không và liệu tôi có thể ăn những món ăn xa lạ đó không? Đột nhiên, tôi nghe thấy tên mình được gọi cùng với tên của bạn học cùng chương trình trao đổi, Brigitte Schmitt. Một cô gái tóc vàng xinh xắn bước lên phía trước, nở nụ cười thật tươi. Đứng phía sau cô ấy là bố mẹ cô, một cặp vợ chồng trông dễ mến và cũng đang mỉm cười. Họ chìa tay ra và nói: 'Willkommen in Deutschland. Chào mừng đến với nước Đức.'" },
          { en: "I spent three happy weeks with the Schmitt family. Brigitte had an elder brother, Hendrik, and a younger sister, Lisa. They had two cats, Ping and Pong, who sat on my lap as I looked into the fire in the evenings. The whole family were kind and welcoming. My room was cosy and warm and we looked out onto a forest. The fresh clean smell of the trees and of apples baking in the oven became familiar and comforting, like the smells of home. I learnt in those three weeks that you can feel at home anywhere that people are kind to you.", vi: "Tôi đã trải qua ba tuần vui vẻ cùng gia đình Schmitt. Brigitte có một người anh trai tên Hendrik và một cô em gái tên Lisa. Họ có hai chú mèo, Ping và Pong, chúng thường ngồi trong lòng tôi khi tôi nhìn vào ngọn lửa vào buổi tối. Cả gia đình đều rất tốt bụng và thân thiện. Căn phòng của tôi ấm áp, dễ chịu và nhìn ra một khu rừng. Mùi thơm của cây cối tươi sạch và những quả táo nướng trong lò đã trở nên quen thuộc và dễ chịu, giống như những mùi hương ở nhà. Trong ba tuần đó, tôi đã học được rằng bạn có thể cảm thấy như đang ở nhà ở bất cứ nơi nào mà mọi người đối xử tốt với bạn." },
          { en: "Later that year, Brigitte came to stay with me in the UK. I gave her my room and moved in with my brother. I cleared space for her clothes and put fresh flowers in a vase by the bed. I asked my mum to make her famous roast chicken and an apple pie to make our guest feel at home. We made a welcome banner and put it up on the front door. I did everything I could to help Brigitte feel at home with us. I now understood the importance of a warm welcome.", vi: "Cuối năm đó, Brigitte đến ở cùng tôi tại Vương quốc Anh. Tôi nhường phòng của mình cho cô ấy và chuyển sang ở cùng phòng với em trai. Tôi dọn chỗ để quần áo của cô ấy và cắm những bông hoa tươi vào một chiếc bình cạnh giường. Tôi nhờ mẹ làm món gà quay nổi tiếng của bà và một chiếc bánh táo để vị khách của chúng tôi cảm thấy như đang ở nhà. Chúng tôi làm một tấm biểu ngữ chào mừng và treo nó ở cửa trước. Tôi đã làm tất cả những gì có thể để giúp Brigitte cảm thấy thoải mái như ở nhà khi ở cùng chúng tôi. Giờ đây, tôi đã hiểu được tầm quan trọng của một lời chào đón nồng nhiệt." }

      {
        id: 3,
        part: "01. DẠNG BÀI SENTENCE COMPLETION",
        title: "Activity 3: FOOD CULTURE SHOCK",
        instruction: "Complete these sentences using a word from the text.",
        passage: [
          { en: "A CHARLES: You would think that eating with your fingers would be easy. In the US, there are only certain things you can eat with your fingers, like burgers, for example, and that is easy enough. When I went to South India, though, I realised that it is a whole new skill to learn to eat rice and curry with your fingers. You have to mix the curries together and with the rice and form a ball. Daal* is particularly helpful as a kind of glue. You use your fingertips, never the palm of your hand, and use your thumb to pop it into your mouth. I thought I knew where my mouth was, but my first few attempts were a disaster. There was food everywhere! (*Daal is a lentil curry widely eaten in the Indian subcontinent.)", vi: "A. CHARLES: Bạn có thể nghĩ rằng ăn bằng tay thì hẳn là rất dễ. Ở Mỹ, chỉ có một số món nhất định mà bạn có thể ăn bằng tay, chẳng hạn như bánh burger, và việc đó khá đơn giản. Tuy nhiên, khi đến miền Nam Ấn Độ, tôi nhận ra rằng ăn cơm và cà ri bằng tay là cả một kỹ năng hoàn toàn mới cần phải học. Bạn phải trộn các món cà ri với nhau và với cơm rồi vo thành một viên. Daal đặc biệt hữu ích vì nó giống như một loại chất kết dính. Bạn dùng các đầu ngón tay, tuyệt đối không dùng lòng bàn tay, và dùng ngón cái để đẩy thức ăn vào miệng. Tôi cứ nghĩ mình biết miệng mình nằm ở đâu, nhưng vài lần thử đầu tiên của tôi đúng là một thảm họa. Thức ăn vương vãi khắp nơi!" },
          { en: "B ALFREDO: For me, when I travel, the 'fast food' culture always shocks me. I can't believe there are people in the world who live on 'junk food' like burgers and just grab a sandwich for lunch. Back home, food is very important to us. We cook fresh food for lunch and dinner and sit down and eat as a family at least once a day, twice at weekends. A lot of people grow their own vegetables and keep chickens. Food is part of your identity, so what are you saying about yourself when you eat some rubbish which contains chemicals and goodness knows what else? The worst thing I have seen on my travels is a baby being given a fizzy drink in a bottle. That really shocked me!", vi: "B. ALFREDO: Đối với tôi, khi đi du lịch, văn hóa “đồ ăn nhanh” luôn khiến tôi bị sốc. Tôi không thể tin rằng trên thế giới lại có những người sống bằng những loại “đồ ăn vặt” như bánh burger và chỉ đơn giản mua một chiếc bánh sandwich cho bữa trưa. Ở quê tôi, đồ ăn rất quan trọng đối với chúng tôi. Chúng tôi nấu đồ ăn tươi cho bữa trưa và bữa tối rồi ngồi xuống ăn cùng gia đình ít nhất một lần mỗi ngày, và hai lần vào cuối tuần. Rất nhiều người tự trồng rau và nuôi gà. Thức ăn là một phần bản sắc của bạn, vậy bạn đang nói gì về chính mình khi ăn những thứ đồ ăn tạp nham chứa hóa chất và chẳng ai biết còn có những gì khác trong đó? Điều tồi tệ nhất tôi từng thấy trong những chuyến đi của mình là một em bé được cho uống nước có ga bằng bình sữa. Điều đó thực sự khiến tôi bị sốc!" },
          { en: "C QIANG SHI: I enjoy trying food from different countries, but what interests me more is the culture and habits surrounding food and eating. In China, when we go to a restaurant with colleagues, when we are offered something, we say 'No thanks', even though we want it, because the person will definitely repeat the offer. In other countries, though, 'no' means 'no', so if you are trying to be polite and don't take it the first time, you will end up with nothing! To me, it feels wrong to take something the first time it's offered, so it took me a while to get used to that when I travel abroad.", vi: "C. QIANG SHI: Tôi thích thử đồ ăn từ nhiều quốc gia khác nhau, nhưng điều khiến tôi quan tâm hơn cả là văn hóa và những thói quen xoay quanh đồ ăn và việc ăn uống. Ở Trung Quốc, khi chúng tôi đi ăn nhà hàng cùng đồng nghiệp, khi được mời một món gì đó, chúng tôi sẽ nói “Không, cảm ơn”, mặc dù chúng tôi muốn món đó, bởi vì người mời chắc chắn sẽ tiếp tục mời. Tuy nhiên, ở những quốc gia khác, “không” có nghĩa là “không”, vì vậy nếu bạn cố tỏ ra lịch sự và không nhận món đó ngay lần đầu tiên, bạn sẽ chẳng nhận được gì cả! Đối với tôi, việc nhận một món gì đó ngay lần đầu tiên được mời có vẻ không lịch sự, vì vậy tôi đã mất một thời gian để làm quen với điều đó khi đi du lịch nước ngoài." },
          { en: "D PAULINE: Being a vegetarian is so easy here in the UK that we forget that not everyone in the world understands vegetarianism. For vegans the situation is even more difficult. Probably the best place I've been to is India, as everything is divided into 'veg' or 'non veg' so you know exactly what you're getting. In many countries, they don't even realise that there is a concept of not eating meat for ethical reasons. In many parts of the world, meat equates to prosperity, so the idea of going out for a meal and not having meat is alien to them. I have travelled to places where, as a vegetarian, all I have been able to eat is salad, fruit and chips. I'm glad to get home where we have special vegetarian products.", vi: "D. PAULINE: Làm người ăn chay ở Anh dễ đến mức chúng tôi quên rằng không phải tất cả mọi người trên thế giới đều hiểu về việc ăn chay. Đối với người ăn chay thuần chay, tình hình còn khó khăn hơn. Có lẽ nơi tốt nhất tôi từng đến là Ấn Độ, vì ở đó mọi thứ đều được phân chia thành “đồ chay” hoặc “đồ không chay”, nên bạn biết chính xác mình sẽ nhận được món gì. Ở nhiều quốc gia, người ta thậm chí còn không nhận ra rằng có quan niệm không ăn thịt vì những lý do đạo đức. Ở nhiều nơi trên thế giới, thịt đồng nghĩa với sự sung túc, vì vậy ý tưởng ra ngoài ăn một bữa mà không có thịt là điều xa lạ đối với họ. Tôi đã đi đến những nơi mà với tư cách là một người ăn chay, tất cả những gì tôi có thể ăn chỉ là salad, trái cây và khoai tây chiên. Tôi rất vui khi trở về nhà, nơi chúng tôi có những cửa hàng đặc biệt cho người ăn chay." },
          { en: "E AILEEN: I think breakfast is the meal where food culture really hits you. In Australia, there are certain foods you eat for breakfast and certain foods you don't. We usually eat cereal or toast, maybe yoghurt and fruit. We would never eat chicken or vegetables. But when I travelled in Asia, I realised that in many places, there is no difference between breakfast and dinner: rice, curry, noodles, soup, steamed vegetables and fish all appeared at breakfast. Even though I love all those things, I just can't face them at breakfast!", vi: "E. AILEEN: Tôi nghĩ bữa sáng là bữa ăn mà sự khác biệt về văn hóa ẩm thực thực sự tác động mạnh đến bạn. Ở Úc, có một số món nhất định mà bạn ăn vào bữa sáng và một số món thì không. Chúng tôi thường ăn ngũ cốc hoặc bánh mì nướng, có thể thêm sữa chua và trái cây. Chúng tôi sẽ không bao giờ ăn thịt gà hoặc rau. Nhưng khi đi du lịch ở châu Á, tôi nhận ra rằng ở nhiều nơi, không có sự khác biệt giữa bữa sáng và bữa tối: cơm, cà ri, mì, súp, rau hấp và cá đều xuất hiện vào bữa sáng. Mặc dù tôi rất thích tất cả những món đó, nhưng tôi thực sự không thể ăn chúng vào bữa sáng!" }

      {
        id: 4,
        part: "01. DẠNG BÀI SENTENCE COMPLETION",
        title: "Activity 4: OUR FRIENDS AND PROTECTORS",
        instruction: "Write NO MORE THAN TWO/THREE WORDS from the passage for each answer.",
        passage: [
          { en: "A When asked their favourite animals, many people answer 'dolphins'. They are known as friendly, intelligent creatures that have a special relationship with humans. For example, dolphins can tell when a woman is pregnant. They can also tell when someone is in trouble. No one is really sure why this is the case. Experts think they may understand that humans are similar to them and try to protect them from predators and other dangers. Dolphins' protection of humans might not be just automatic or instinctive: they may actively decide to help in certain situations.", vi: "A Khi được hỏi về loài động vật yêu thích, nhiều người trả lời là “cá heo”. Cá heo được biết đến là những sinh vật thân thiện, thông minh và có mối quan hệ đặc biệt với con người. Ví dụ, cá heo có thể nhận biết khi một phụ nữ đang mang thai. Chúng cũng có thể nhận biết khi ai đó gặp nguy hiểm. Không ai thực sự chắc chắn tại sao lại như vậy. Các chuyên gia cho rằng có thể cá heo hiểu rằng con người cũng giống chúng và cố gắng bảo vệ con người khỏi những loài săn mồi và những mối nguy hiểm khác. Việc cá heo bảo vệ con người có thể không chỉ đơn thuần là hành động tự động hay theo bản năng: trong một số tình huống nhất định, chúng chủ động quyết định giúp đỡ con người." },
          { en: "B There are many stories about dolphins protecting humans from sharks. Wildlife filmmaker Hardy Jones was filming a group of dolphins, when a large shark swam towards him ready to attack. Four dolphins came to his rescue and drove the shark away. Perhaps they could tell he was a person who cared very much about dolphins. In fact, Jones was a well-known campaigner against the killing of dolphins. In another incident, in 2004, in New Zealand, four people were saved from a great white shark by a pod of dolphins. The dolphins herded the swimmers into a group and formed a protective ring around them. As they had not yet seen the shark, one of them tried to swim away. He couldn't get away, because every time he tried, he was pushed back inside the ring by the dolphins.", vi: "B Có rất nhiều câu chuyện về việc cá heo bảo vệ con người khỏi cá mập. Nhà làm phim về động vật hoang dã Hardy Jones đang quay phim một đàn cá heo thì một con cá mập lớn bơi về phía ông, sẵn sàng tấn công. Bốn con cá heo đã đến giải cứu ông và xua con cá mập đi. Có lẽ chúng có thể nhận ra ông là một người rất quan tâm đến cá heo. Thực tế, Jones là một nhà vận động nổi tiếng chống lại việc giết hại cá heo. Trong một sự việc khác vào năm 2004 tại New Zealand, bốn người đã được một đàn cá heo cứu khỏi một con cá mập trắng lớn. Những con cá heo dồn những người đang bơi lại thành một nhóm và tạo thành một vòng tròn bảo vệ xung quanh họ. Vì họ vẫn chưa nhìn thấy con cá mập nên một người trong số họ đã cố bơi ra xa. Anh ấy không thể thoát ra được, bởi mỗi lần cố gắng, anh lại bị những con cá heo đẩy trở lại bên trong vòng tròn." },
          { en: "C Dolphins don't only save humans from sharks, but protect them in other situations too. A scuba diver was hit by a boat near the Channel Islands (between England and France) in 2006. The man was unconscious, but survived 56 hours in the water, watched over by a pod of about 150 dolphins. In 2014, dolphins again came to the help of a human. Joey Trevino was losing hope. He had been in the sea for 24 hours after his boat sank in the Gulf of Mexico. He felt he couldn't keep going any more. A friendly dolphin approached him and gently pushed him, as if to say 'don't give up'. That moral support and encouragement may have saved Trevino's life.", vi: "C Cá heo không chỉ cứu con người khỏi cá mập mà còn bảo vệ họ trong những tình huống khác. Một thợ lặn đã bị một chiếc thuyền đâm phải gần quần đảo Channel (nằm giữa Anh và Pháp) vào năm 2006. Người đàn ông bất tỉnh nhưng đã sống sót sau 56 giờ dưới nước nhờ được một đàn khoảng 150 con cá heo trông chừng. Năm 2014, cá heo một lần nữa đến cứu một người. Joey Trevino đang mất dần hy vọng. Anh đã ở trên biển suốt 24 giờ sau khi thuyền của mình bị chìm ở Vịnh Mexico. Anh cảm thấy mình không thể tiếp tục được nữa. Một con cá heo thân thiện tiến lại gần và nhẹ nhàng đẩy anh, như thể muốn nói “đừng bỏ cuộc”. Sự động viên và hỗ trợ về tinh thần đó có thể đã cứu mạng Trevino." },
          { en: "D Dolphins have also been known to help other species. In New Zealand, two pygmy sperm whales were in difficulty next to a sand bank. People were trying their best to get them back out to sea, but the whales couldn't find their way past the sand bank. After several hours of failed attempts, they were ready to give up. Along came 'Moko', a bottlenose dolphin, who seemed to communicate with the whales and led them to a channel which took them back to the ocean.", vi: "D Cá heo cũng được biết đến với việc giúp đỡ các loài khác. Ở New Zealand, hai con cá nhà táng lùn gặp khó khăn ở gần một bãi cát ngầm. Mọi người đã cố hết sức để đưa chúng trở lại biển, nhưng những con cá voi không thể tìm được đường vượt qua bãi cát ngầm. Sau nhiều giờ cố gắng nhưng không thành công, mọi người đã chuẩn bị từ bỏ. Đúng lúc đó, Moko, một con cá heo mũi chai, xuất hiện. Nó dường như giao tiếp với hai con cá voi và dẫn chúng đến một luồng nước giúp đưa chúng trở lại đại dương." },
          { en: "E Whales have also been known to protect both humans and other mammals. In California, in 2012, a BBC Planet Earth film crew filmed a group of humpback whales who were protecting migrating grey whales from attacks by orcas (killer whales) over a period of at least seven hours. In China, Yang Yun applied for a job training whales at Polar Land in the city of Harbin. For the 'interview' she had to dive down as far as possible in the seven-metre deep pool. When she was about five metres down, Yang Yun found she couldn't move her legs due to the freezing temperatures. Two beluga whales, Mila and Nicola, sensed that she was in trouble. Mila gripped Yang Yun's leg in her mouth and pushed Yun to the surface, saving her life.", vi: "E Cá voi cũng được biết đến với việc bảo vệ cả con người và các loài động vật có vú khác. Tại California vào năm 2012, một đoàn làm phim của BBC Planet Earth đã quay cảnh một đàn cá voi lưng gù bảo vệ những con cá voi xám đang di cư khỏi sự tấn công của cá voi sát thủ trong khoảng thời gian ít nhất bảy giờ. Ở Trung Quốc, Yang Yun đã nộp đơn xin công việc huấn luyện cá voi tại Polar Land ở thành phố Cáp Nhĩ Tân. Để tham gia “buổi phỏng vấn”, cô phải lặn xuống càng sâu càng tốt trong một bể nước sâu bảy mét. Khi cô ở độ sâu khoảng năm mét, Yang Yun phát hiện mình không thể cử động chân do nhiệt độ quá lạnh. Hai con cá voi trắng, Mila và Nicola, nhận ra cô đang gặp nguy hiểm. Mila ngoạm chân Yang Yun trong miệng rồi đẩy Yun lên mặt nước, cứu sống cô." },
          { en: "F Stories of marine mammals helping humans - and each other - date back to Ancient Greece. Although we may never be sure why they help us, many people feel that is a good reason for us to do whatever we can to protect them.", vi: "F Những câu chuyện về các loài động vật có vú sống ở biển giúp đỡ con người và giúp đỡ lẫn nhau – đã có từ thời Hy Lạp cổ đại. Mặc dù có thể chúng ta sẽ không bao giờ biết chắc tại sao chúng lại giúp đỡ chúng ta, nhưng nhiều người cho rằng đó là một lý do chính đáng để chúng ta làm bất cứ điều gì có thể nhằm bảo vệ chúng." }
        ],

      {
        id: 5,
        part: "01. DẠNG BÀI SENTENCE COMPLETION",
        title: "Activity 5: THE MODERN ZOO",
        instruction: "Choose NO MORE THAN TWO WORDS from the passage for each answer.",
        passage: [
          { en: "The first zoo is believed to have been in Egypt in around 3500 BC. Early collections of animals on display often belonged to royalty. King Henry I of England had lions, leopards and camels. He had received them as gifts. Until the late twentieth century, the main purpose of zoos was for entertainment. They existed to give people the chance to see animals they could not see in the wild. In 1959, famous wildlife expert Gerald Durrell opened the first zoo which put conservation of animals first.", vi: "Vườn thú đầu tiên được cho là đã xuất hiện ở Ai Cập vào khoảng năm 3500 trước Công nguyên. Những bộ sưu tập động vật được trưng bày thời kỳ đầu thường thuộc về hoàng gia. Vua Henry I của Anh từng sở hữu sư tử, báo hoa mai và lạc đà. Ông nhận được chúng làm quà tặng. Cho đến cuối thế kỷ 20, mục đích chính của các vườn thú vẫn là phục vụ nhu cầu giải trí. Chúng tồn tại để mang đến cho mọi người cơ hội được nhìn thấy những loài động vật mà họ không thể thấy trong tự nhiên. Năm 1959, nhà bảo tồn động vật hoang dã nổi tiếng Gerald Durrell đã mở vườn thú đầu tiên đặt việc bảo tồn động vật lên hàng đầu." },
          { en: "Nowadays zoos' aims are: conservation, education, entertainment, in that order. Modern zoos try to get a balance between providing safe, comfortable homes for the animals and opportunities for visitors to see animals in natural surroundings. Zoos now share their knowledge and support each other. The World Association for Zoos and Aquariums (WAZA) works to educate people about animal welfare and conservation. It also helps to coordinate breeding programmes.", vi: "Ngày nay, mục tiêu của các vườn thú lần lượt là bảo tồn, giáo dục và giải trí, theo thứ tự đó. Các vườn thú hiện đại cố gắng cân bằng giữa việc cung cấp cho động vật một nơi ở an toàn, thoải mái và tạo cơ hội cho du khách được nhìn thấy động vật trong môi trường tự nhiên. Hiện nay, các vườn thú chia sẻ kiến thức và hỗ trợ lẫn nhau. Hiệp hội Vườn thú và Thủy cung Thế giới (WAZA) hoạt động nhằm giáo dục mọi người về phúc lợi và bảo tồn động vật. Tổ chức này cũng hỗ trợ điều phối các chương trình nhân giống." },
          { en: "From the 1990s, zoos began to see their main role as saving the most threatened species. Each zoo focuses on a small number of species. The Siberian tiger and the orangutan are two species that have been saved through breeding programmes run by zoos. For example, in 2005 there were between 331 and 393 Siberian tigers in the Russian Far East. By 2015, there were 562. The tigers were helped to breed under the Species Survival Plan of the Association of Zoos and Aquariums (AZA). Often the aim is to reintroduce endangered species into their natural habitats. In Indonesia, Borneo Orangutan Rescue teaches orangutans how to live in the wild. When they are ready, they are taken to protected forests to live naturally.", vi: "Từ những năm 1990, các vườn thú bắt đầu coi vai trò chính của mình là cứu những loài đang bị đe dọa nghiêm trọng nhất. Mỗi vườn thú tập trung vào một số lượng nhỏ các loài. Hổ Siberia và đười ươi là hai loài đã được cứu nhờ các chương trình nhân giống do các vườn thú thực hiện. Ví dụ, vào năm 2005, có khoảng từ 331 đến 393 con hổ Siberia sinh sống ở vùng Viễn Đông của Nga. Đến năm 2015, con số này đã tăng lên 562. Những con hổ này đã được hỗ trợ nhân giống theo Kế hoạch Sinh tồn Loài của Hiệp hội Vườn thú và Thủy cung (AZA). Mục tiêu thường là đưa các loài có nguy cơ tuyệt chủng trở lại môi trường sống tự nhiên của chúng. Tại Indonesia, Trung tâm Cứu hộ Đười ươi Borneo dạy những con đười ươi cách sống trong tự nhiên. Khi chúng sẵn sàng, chúng được đưa đến những khu rừng được bảo vệ để sống một cách tự nhiên." },
          { en: "Now that we have a better understanding of animals, zoos try to recreate natural habitats of animals as accurately as possible. For example, polar bears live in a plain, with open space. Zoos try to provide 'enrichment' for the animals to improve their wellbeing. This includes climbing frames, feeding puzzles, unusual objects and different types of food. It allows animals to behave in a normal way, such as scratching, climbing, digging and solving problems. Another type of enrichment is mixing up types of animal that would naturally mix in the wild. Colchester Zoo in England has a 'kingdom of the wild' paddock where several species live together. They have found positive changes to the behaviour of these animals as a result.", vi: "Ngày nay, khi chúng ta hiểu biết rõ hơn về động vật, các vườn thú cố gắng tái tạo môi trường sống tự nhiên của chúng một cách chính xác nhất có thể. Ví dụ, gấu Bắc Cực sống trên một vùng đồng bằng có không gian rộng rãi. Các vườn thú cố gắng cung cấp những hình thức “làm phong phú môi trường sống” cho động vật nhằm cải thiện sức khỏe và chất lượng cuộc sống của chúng. Điều này bao gồm các khung leo trèo, trò chơi tìm thức ăn, những đồ vật khác lạ và nhiều loại thức ăn khác nhau. Nhờ đó, động vật có thể thực hiện những hành vi bình thường như cào, leo trèo, đào bới và giải quyết vấn đề. Một hình thức làm phong phú môi trường sống khác là cho các loài động vật vốn thường sống cùng nhau trong tự nhiên sống chung với nhau. Vườn thú Colchester ở Anh có một khu nuôi nhốt mang tên 'Kingdom of the Wild', nơi một số loài cùng chung sống. Họ nhận thấy rằng nhờ đó, hành vi của những loài động vật này có những thay đổi tích cực." },
          { en: "Different types of technology are used to help create natural environments for animals. In Indianapolis Zoo, in the United States, for example, there is a 'functional forest' called the Hutan trail, a series of towers and cables 20 metres above the ground. This allows orangutans to swing around the zoo as they would swing around the forest in their native Indonesia. The cables are strong enough to give them a safe and comfortable trip around the zoo. They have access to three oases, where they can go when they want to be apart from the group. Likewise, technology has been used to engage the public more with the animals. In many zoos there are webcams in some enclosures so visitors can keep up with their favourite animals between visits to the zoo.", vi: "Nhiều loại công nghệ khác nhau được sử dụng để giúp tạo ra môi trường tự nhiên cho động vật. Ví dụ, tại Vườn thú Indianapolis ở Hoa Kỳ có một “khu rừng chức năng” mang tên Hutan Trail, gồm một hệ thống tháp và dây cáp ở độ cao 20 mét so với mặt đất. Điều này cho phép những con đười ươi đu mình quanh vườn thú giống như cách chúng đu mình trong những khu rừng ở Indonesia, nơi chúng sinh sống tự nhiên. Những sợi dây cáp đủ chắc chắn để mang lại cho chúng một hành trình an toàn và thoải mái quanh vườn thú. Chúng có thể tiếp cận ba khu vực riêng biệt, nơi chúng có thể đến khi muốn tách khỏi đàn. Tương tự, công nghệ cũng được sử dụng để giúp công chúng tương tác nhiều hơn với các loài động vật. Ở nhiều vườn thú hiện nay, một số khu nuôi nhốt có lắp webcam để du khách có thể theo dõi những con vật yêu thích của mình trong khoảng thời gian giữa các lần đến thăm vườn thú." },
          { en: "Zoos have moved on over the last few decades. They now play an important role in protecting animals and in making people more aware of the importance of animals. Zoos have made people aware that animals should not be over-hunted and that they play an important role in the ecology of the planet and in helping to maintain the balance of nature.", vi: "Các vườn thú đã có nhiều thay đổi trong vài thập kỷ qua. Ngày nay, chúng đóng vai trò quan trọng trong việc bảo vệ động vật và giúp mọi người nhận thức rõ hơn về tầm quan trọng của động vật. Các vườn thú đã giúp mọi người hiểu rằng không nên săn bắt động vật quá mức và rằng động vật đóng vai trò quan trọng trong hệ sinh thái của hành tinh cũng như trong việc góp phần duy trì sự cân bằng của tự nhiên." }

      {
        id: 6,
        part: "02. DẠNG BÀI SUMMARY COMPLETION",
        title: "Activity 6: UNUSUAL SPORTS",
        instruction: "Complete summary: [A boring, B change, C clever, D feature, E horses, F join, G mixed, H moving, I serious, J sport, K strange, L trampolines]",
        passage: [
          { en: "A Do you ever get bored with the same old sports? If you're tired of tennis, fed up with football or bored of basketball, don't worry. There are plenty of new and unusual sports out there for you to try. Many of these are a mix of existing sports, sometimes with a local element added. Bossaball, for example, is a mix of football and volleyball, played on an inflatable pitch with a trampoline in the middle. To make it more exciting, it also has elements of Brazilian martial arts!", vi: "A Bạn có bao giờ cảm thấy chán những môn thể thao quen thuộc không? Nếu bạn đã chán quần vợt, ngán bóng đá hay không còn hứng thú với bóng rổ thì cũng đừng lo. Có rất nhiều môn thể thao mới lạ và khác thường để bạn thử. Nhiều môn trong số đó là sự kết hợp của những môn thể thao đã có sẵn, đôi khi được bổ sung thêm những yếu tố mang tính địa phương. Chẳng hạn, Bossaball là sự kết hợp giữa bóng đá và bóng chuyền, được chơi trên một sân bơm hơi có một tấm bạt lò xo ở giữa. Để khiến môn thể thao này thú vị hơn, nó còn có cả những yếu tố của võ thuật Brazil!" },
          { en: "B If you are very good at horse riding, you could try the national sport of Afghanistan, buzkashi. Many versions have been played in the Central Asian region for hundreds of years. The game involves players on horseback trying to get hold of a dead goat. The Afghan Buzkashi Federation wants the game to spread throughout the world and has finally written down the rules because they hope to get Olympic status for the sport.", vi: "B Nếu bạn cưỡi ngựa rất giỏi, bạn có thể thử buzkashi, môn thể thao quốc gia của Afghanistan. Nhiều phiên bản của môn thể thao này đã được chơi ở khu vực Trung Á trong hàng trăm năm. Trò chơi gồm những người chơi cưỡi trên lưng ngựa và cố gắng giành lấy xác một con dê. Liên đoàn Buzkashi Afghanistan muốn môn thể thao này được phổ biến trên toàn thế giới và cuối cùng đã viết ra các luật chơi vì họ hy vọng môn thể thao này sẽ được công nhận là một môn thi đấu tại Thế vận hội Olympic." },
          { en: "C A sport that is more likely to become famous is kabaddi. It is popular in India and other parts of South Asia. It is similar in some ways to the game called 'tag' or 'it' which schoolchildren play. One person is 'it' and has to catch the others. In kabaddi, a 'raider' from one team tries to tag a player from the other team and then return to their own half of the field without getting caught. In some versions of the game, the raider must chant the word 'kabaddi' as he returns to his place. Kabaddi is good fun, good exercise and doesn't need any equipment. It is played at the Asian Games.", vi: "C Một môn thể thao có nhiều khả năng trở nên nổi tiếng hơn là kabaddi. Môn này phổ biến ở Ấn Độ và các khu vực khác của Nam Á. Xét trên một số phương diện, nó tương tự trò chơi có tên là “tag” hoặc “it” mà học sinh thường chơi. Một người đóng vai “it” và phải bắt những người khác. Trong kabaddi, một “raider” của đội này cố gắng chạm vào một người chơi của đội kia rồi quay trở về phần sân của đội mình mà không bị bắt. Trong một số phiên bản của trò chơi, người tấn công phải liên tục hô từ “kabaddi” trong khi quay trở về vị trí của mình. Kabaddi rất vui, giúp vận động tốt và không cần bất kỳ dụng cụ nào. Môn này được thi đấu tại Đại hội Thể thao châu Á." },
          { en: "D There is an unusual sport which describes itself as 'a classic mix of brains and brawn'. The game, called 'chess boxing', involves a round of chess and then a round of boxing, then another of chess, and so on. There is one minute between rounds. The first chess boxing world championship took place in 2003 in Amsterdam and was won by a Dutchman, Iepe Rubingh. Since then, it has become more popular, particularly in Germany, the UK, India and Russia. It is a difficult sport, as players need to be very good at two very different activities and be able to switch quickly between the two.", vi: "D Có một môn thể thao khác thường tự mô tả mình là “sự kết hợp kinh điển giữa trí óc và sức mạnh”. Trò chơi này được gọi là “chess boxing” (cờ vua quyền Anh), bao gồm một hiệp chơi cờ vua, sau đó là một hiệp đấu quyền Anh, rồi lại một hiệp cờ vua, và cứ tiếp tục như vậy. Giữa các hiệp có một phút nghỉ. Giải vô địch cờ vua quyền Anh thế giới đầu tiên được tổ chức tại Amsterdam vào năm 2003 và một người Hà Lan tên là Iepe Rubingh đã giành chiến thắng. Kể từ đó, môn thể thao này ngày càng trở nên phổ biến, đặc biệt là ở Đức, Anh, Ấn Độ và Nga. Đây là một môn thể thao khó vì người chơi cần phải rất giỏi hai hoạt động hoàn toàn khác nhau và có khả năng chuyển đổi nhanh chóng giữa hai hoạt động đó." },
          { en: "E Finally, an unusual sport that will be familiar to most of us is roshambo, which began in China about 2000 years ago and spread gradually to the rest of the world. Played by young and old, in the UK it is known as 'rock-paper-scissors', but it is surprising that it is called a sport and taken so seriously: there's a World Rock Paper Scissors Society and a league which holds championships every year. So, whatever kinds of sport you like, there is something new and interesting for you to try.", vi: "E Cuối cùng, một môn thể thao khác thường nhưng lại quen thuộc với hầu hết chúng ta là roshambo, bắt nguồn từ Trung Quốc khoảng 2.000 năm trước và dần lan rộng ra phần còn lại của thế giới. Cả người trẻ lẫn người lớn tuổi đều chơi trò này; ở Anh, nó được gọi là “rock-paper-scissors” (oẳn tù tì), nhưng điều đáng ngạc nhiên là trò chơi này lại được coi là một môn thể thao và được xem xét một cách nghiêm túc: có một Hiệp hội Oẳn tù tì Thế giới và một giải đấu tổ chức các chức vô địch hằng năm. Vì vậy, dù bạn thích loại hình thể thao nào, vẫn luôn có một môn mới mẻ và thú vị để bạn thử." }
        ],

      {
        id: 7,
        part: "02. DẠNG BÀI SUMMARY COMPLETION",
        title: "Activity 7: Parkour",
        instruction: "Complete summary using words A-M: [A agrees, B barriers, C competition, D conflicts, E creativity, F latecomers, G move, H moving, I personal, J respect, K team, L tournaments, M traceurs]",
        passage: [
          { en: "A Parkour was developed in France in the 1980s by Raymond Belle and later by his son David Belle and his friends. It is based on military obstacle course training. The aim is to get from one point to another in any way you can, and express yourself while doing so. There are no limits on how you move in parkour: running, climbing, swinging, jumping, rolling and any other types of movement are possible. Parkour is more of a philosophy or set of ideas than a sport. It is a new way of seeing the environment and finding ways to go over, under, around, across or through obstacles.", vi: "A Parkour được phát triển ở Pháp vào những năm 1980 bởi Raymond Belle và sau đó là con trai ông, David Belle, cùng những người bạn của anh. Parkour dựa trên hoạt động huấn luyện vượt chướng ngại vật trong quân đội. Mục tiêu là di chuyển từ điểm này đến điểm khác bằng bất kỳ cách nào bạn có thể, đồng thời thể hiện bản thân trong quá trình đó. Không có giới hạn nào về cách bạn di chuyển trong parkour: chạy, leo trèo, đu người, nhảy, lăn và bất kỳ hình thức vận động nào khác đều có thể được sử dụng. Parkour giống một triết lý hoặc một hệ thống tư tưởng hơn là một môn thể thao. Đó là một cách nhìn mới về môi trường xung quanh và tìm ra những cách để vượt qua, luồn xuống dưới, vòng qua hoặc xuyên qua các chướng ngại vật." },
          { en: "B Parkour can be done alone or in groups. The most famous group of traceurs (people who do parkour) were the Yamakasi, a group made up of David Belle and his friends and cousins. They formed in the late 1980s and became popular during the 1990s and 2000s after appearing in several films, documentaries and advertisements. In the Yamakasi, there were strict rules. Members had to arrive on time and they were not allowed to complain or make excuses. They valued humility, so they were not allowed to show off or compete with other members.", vi: "B Parkour có thể được thực hiện một mình hoặc theo nhóm. Nhóm traceur (những người tập parkour) nổi tiếng nhất là Yamakasi, một nhóm gồm David Belle cùng những người bạn và anh em họ của anh. Nhóm được thành lập vào cuối những năm 1980 và trở nên nổi tiếng trong những năm 1990 và 2000 sau khi xuất hiện trong một số bộ phim, phim tài liệu và quảng cáo. Trong nhóm Yamakasi có những quy tắc nghiêm ngặt. Các thành viên phải đến đúng giờ và không được phép phàn nàn hay viện lý do. Họ coi trọng sự khiêm tốn, vì vậy họ không được phép khoe khoang hoặc cạnh tranh với các thành viên khác." },
          { en: "C Parkour is a 'state of mind'. It is about getting over mental as well as physical barriers. It teaches people to touch the world and interact with it. It is about understanding what it means to be human. The organisation Parkour.net believes that parkour can never be a competitive sport. It is an art and is concerned with self-development. They say you can't ask, 'Who is the best at parkour?' Raymond Belle's advice is: 'If two roads open up before you, always take the more difficult one. Because you know you can travel the easy one.'", vi: "C Parkour là một “trạng thái tinh thần”. Nó liên quan đến việc vượt qua những rào cản về tinh thần cũng như thể chất. Parkour dạy mọi người tiếp xúc với thế giới và tương tác với nó. Đó là việc hiểu được ý nghĩa của việc làm người. Tổ chức Parkour.net cho rằng parkour không bao giờ có thể trở thành một môn thể thao mang tính cạnh tranh. Đó là một nghệ thuật và chú trọng đến sự phát triển bản thân. Họ nói rằng bạn không thể hỏi: “Ai là người tập parkour giỏi nhất?” Lời khuyên của Raymond Belle là: “Nếu có hai con đường mở ra trước mắt bạn, hãy luôn chọn con đường khó hơn. Bởi vì bạn biết rằng mình có thể đi con đường dễ dàng.”" },
          { en: "D There are some gyms and camps where you can practise and learn parkour. However, many traceurs do not like the idea of special places for their activity. The idea behind parkour is to adapt to any environment and be creative about how you get through it. It is about freedom and self-expression. The founder of parkour refused to teach people how to do moves or get over obstacles. The whole point is to learn your own technique and way of moving. So the idea of having classes or a limited space to practise in conflicts with the values of parkour.", vi: "D Có một số phòng tập và trại huấn luyện nơi bạn có thể luyện tập và học parkour. Tuy nhiên, nhiều traceur không thích ý tưởng có những địa điểm chuyên biệt dành cho hoạt động của họ. Ý tưởng đằng sau parkour là thích nghi với bất kỳ môi trường nào và sáng tạo trong cách bạn vượt qua môi trường đó. Parkour đề cao sự tự do và thể hiện bản thân. Người sáng lập parkour từ chối dạy mọi người cách thực hiện các động tác hoặc vượt qua chướng ngại vật. Mục đích chính là học kỹ thuật và cách di chuyển của riêng mình. Vì vậy, ý tưởng tổ chức các lớp học hoặc có một không gian giới hạn để luyện tập mâu thuẫn với những giá trị của parkour." },
          { en: "E Parkour is also known as freerunning. Sometimes freerunning refers to another form of parkour developed by Sebastien Foucan, which has more focus on the individual. The term freerunning came out of the film Jump London (2003). It told the story of three French traceurs practising parkour around the famous monuments of London. Freerunning was the English translation of parkour. There are more similarities than differences between the two activities, and the Parkour UK website uses the two terms to refer to the same activity.", vi: "E Parkour còn được gọi là freerunning. Đôi khi, freerunning dùng để chỉ một hình thức parkour khác do Sebastien Foucan phát triển, trong đó tập trung nhiều hơn vào cá nhân. Thuật ngữ freerunning xuất hiện từ bộ phim Jump London (2003). Bộ phim kể về ba traceur người Pháp tập luyện parkour quanh những công trình nổi tiếng của London. Freerunning là cách dịch từ parkour sang tiếng Anh. Hai hoạt động này có nhiều điểm tương đồng hơn là khác biệt, và trang web Parkour UK sử dụng cả hai thuật ngữ để chỉ cùng một hoạt động." }

          { en: "A Do you ever get bored with the same old sports? If you're tired of tennis, fed up with football or bored of basketball, don't worry. There are plenty of new and unusual sports out there for you to try. Many of these are a mix of existing sports, sometimes with a local element added. Bossaball, for example, is a mix of football and volleyball, played on an inflatable pitch with a trampoline in the middle. To make it more exciting, it also has elements of Brazilian martial arts!", vi: "A Bạn có bao giờ chán những môn thể thao quen thuộc? Bossaball là sự kết hợp giữa bóng đá và bóng chuyền, chơi trên sân bơm hơi có tấm bạt lò xo ở giữa kèm võ thuật Brazil!" },
          { en: "B If you are very good at horse riding, you could try the national sport of Afghanistan, buzkashi. Many versions have been played in the Central Asian region for hundreds of years. The game involves players on horseback trying to get hold of a dead goat. The Afghan Buzkashi Federation wants the game to spread throughout the world and has finally written down the rules because they hope to get Olympic status for the sport.", vi: "B Môn buzkashi của Afghanistan gồm những người chơi trên lưng ngựa tranh giành xác một con dê. Họ hy vọng môn này sẽ được công nhận tại Thế vận hội Olympic." },

      const sel = window.getSelection();
      if (!sel.isCollapsed && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const container = range.commonAncestorContainer;

        // Bôi đen ở cột trái (bài đọc)

          leftHlToolbar.style.top = `${rect.top - pRect.top - 38}px`;
          leftHlToolbar.style.left = `${Math.max(10, rect.left - pRect.left + (rect.width / 2) - 80)}px`;
          leftHlToolbar.classList.remove('hidden');
          return;
        }

        // Bôi đen ở cột phải (câu hỏi, bỏ qua ô input đang nhập liệu)
        if (rightSection.contains(container) && e.target.tagName !== 'INPUT') {
          hideToolbars();
          savedRange = range.cloneRange();
          const rect = range.getBoundingClientRect();
          const pRect = rightSection.getBoundingClientRect();
          rightHlToolbar.style.top = `${rect.top - pRect.top - 38}px`;
          rightHlToolbar.style.left = `${Math.max(10, rect.left - pRect.left + (rect.width / 2) - 80)}px`;
          rightHlToolbar.classList.remove('hidden');
          return;
        }
      }
      hideToolbars();
    }

    // Bắt đồng thời cả chuột và chạm cảm ứng trên iPad
    document.addEventListener('mouseup', handleTextSelection);
    document.addEventListener('touchend', function(e) {
      setTimeout(() => handleTextSelection(e), 60);
    });

    document.addEventListener('selectionchange', function() {
      const sel = window.getSelection();
      if (!sel.isCollapsed && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        const container = range.commonAncestorContainer;
        if (leftSection.contains(container) || rightSection.contains(container)) {
          savedRange = range.cloneRange();
        }
      }
    });

    function hideToolbars() {
      if (leftHlToolbar) leftHlToolbar.classList.add('hidden');
      if (rightHlToolbar) rightHlToolbar.classList.add('hidden');
    }

    function applyHighlight(colorClass) {
      const sel = window.getSelection();
      let targetRange = savedRange;
      if (!sel.isCollapsed && sel.rangeCount > 0) {
        targetRange = sel.getRangeAt(0);
      }
      if (!targetRange) return;

      const span = document.createElement('span');
      span.className = colorClass;
      try {
        span.appendChild(targetRange.extractContents());
        targetRange.insertNode(span);
      } catch (err) {
        console.warn("Lỗi highlight vùng chọn phức tạp:", err);
      }

      window.getSelection().removeAllRanges();
      savedRange = null;
      hideToolbars();
    }

    function removeSelectedHighlight() {
      const sel = window.getSelection();
      let targetRange = savedRange;
      if (!sel.isCollapsed && sel.rangeCount > 0) {
        targetRange = sel.getRangeAt(0);
      }
      if (!targetRange) return;

      const common = targetRange.commonAncestorContainer;
      const parentSpan = common.nodeType === 1 ? common : common.parentElement;

      if (parentSpan && (parentSpan.classList.contains('hl-yellow') || parentSpan.classList.contains('hl-green') || parentSpan.classList.contains('hl-cyan') || parentSpan.classList.contains('hl-pink'))) {
        const parent = parentSpan.parentNode;
        while (parentSpan.firstChild) {
          parent.insertBefore(parentSpan.firstChild, parentSpan);
        }
        parent.removeChild(parentSpan);
      }
      window.getSelection().removeAllRanges();
      savedRange = null;
      hideToolbars();
    }

    function clearLeftHighlights() {
      if (!confirm("Xóa toàn bộ highlight ở bài đọc?")) return;
      const marks = leftSection.querySelectorAll('.hl-yellow, .hl-green, .hl-cyan, .hl-pink');
      marks.forEach(span => {
        const parent = span.parentNode;
        while (span.firstChild) {
          parent.insertBefore(span.firstChild, span);
        }
        parent.removeChild(span);
      });
      hideToolbars();
    }

    function clearRightHighlights() {
      if (!confirm("Xóa toàn bộ highlight ở phần câu hỏi?")) return;
      const marks = rightSection.querySelectorAll('.hl-yellow, .hl-green, .hl-cyan, .hl-pink');
      marks.forEach(span => {
        const parent = span.parentNode;
        while (span.firstChild) {
          parent.insertBefore(span.firstChild, span);
        }
        parent.removeChild(span);
      });
      hideToolbars();
    }

    // TTS AI Reader cho bài đọc
    function toggleAudio() {
      if (!synth) {
        alert("Trình duyệt không hỗ trợ Web Speech AI!");
        return;
      }
      const icon = document.getElementById('audio-icon');
      const text = document.getElementById('audio-text');
      const rate = parseFloat(document.getElementById('audio-rate').value) || 1.0;

      if (isPlaying) {
        synth.cancel();
        isPlaying = false;
        icon.className = "fa-solid fa-play";
        text.textContent = "Audio AI";
      } else {
        synth.cancel();
        const paras = document.querySelectorAll('#passage-container .en-text');
        let fullText = ACTIVITIES[currentActIndex].title + ". ";
        paras.forEach(p => fullText += p.innerText + " ");

        utterance = new SpeechSynthesisUtterance(fullText);
        utterance.lang = 'en-US';
        utterance.rate = rate;

        utterance.onend = () => {
          isPlaying = false;
          icon.className = "fa-solid fa-play";
          text.textContent = "Audio AI";
        };
        utterance.onerror = () => {
          isPlaying = false;
          icon.className = "fa-solid fa-play";
          text.textContent = "Audio AI";
        };

        synth.speak(utterance);
        isPlaying = true;
        icon.className = "fa-solid fa-stop";
        text.textContent = "Dừng";
      }
    }

    function cleanStr(s) {
      return (s || "").trim().toLowerCase().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ");
    }

    function submitQuiz(e) {
      e.preventDefault();
      const act = ACTIVITIES[currentActIndex];
      let correctCount = 0;
      const total = act.questions.length;

      act.questions.forEach((q, idx) => {
        const input = document.getElementById(`ans-${idx}`);
        const userVal = cleanStr(input.value);
        const fb = document.getElementById(`fb-${idx}`);

        const isCorrect = q.ans.some(a => cleanStr(a) === userVal);
        fb.classList.remove('hidden');

        if (isCorrect && userVal !== '') {
          correctCount++;
          input.className = "w-full px-2.5 py-1 text-xs border-2 border-emerald-500 bg-emerald-50 text-emerald-900 rounded-md focus:outline-none";
          fb.className = "mt-1.5 p-2 rounded-md text-xs leading-relaxed bg-emerald-50 border border-emerald-200 text-emerald-950";
          fb.innerHTML = `
            <div class="font-bold flex items-center gap-1 text-emerald-700">
              <i class="fa-solid fa-circle-check"></i> Chính xác!
            </div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Vị trí:</span> ${q.loc}</div>
            <div class="mt-0.5"><span class="font-semibold text-slate-700">Giải thích:</span> ${q.exp}</div>
          `;
        } else {
          input.className = "w-full px-2.5 py-1 text-xs border-2 border-rose-500 bg-rose-50 text-rose-900 rounded-md focus:outline-none";
          fb.className = "mt-1.5 p-2 rounded-md text-xs leading-relaxed bg-rose-50 border border-rose-200 text-rose-950";
          fb.innerHTML = `
            <div class="font-bold flex items-center gap-1 text-rose-700">
              <i class="fa-solid fa-circle-xmark"></i> Chưa chính xác!
            </div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Đáp án chuẩn:</span> <strong class="text-rose-800 uppercase font-mono">${q.ans[0]}</strong></div>
            <div class="mt-1"><span class="font-semibold text-slate-700">Vị trí:</span> ${q.loc}</div>
            <div class="mt-0.5"><span class="font-semibold text-slate-700">Giải thích:</span> ${q.exp}</div>
          `;
        }
      });

      const badge = document.getElementById('score-badge');
      const display = document.getElementById('score-display');
      badge.classList.remove('hidden');
      display.textContent = `${correctCount}/${total}`;

      document.querySelector('[data-qid="0"]').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function resetCurrentQuiz() {
      const act = ACTIVITIES[currentActIndex];
      act.questions.forEach((q, idx) => {
        const input = document.getElementById(`ans-${idx}`);
        input.value = '';
        input.className = "w-full px-2.5 py-1 text-xs border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:outline-none transition";
        const fb = document.getElementById(`fb-${idx}`);
        fb.className = "hidden mt-1.5 p-2 rounded-md text-xs leading-relaxed";
        fb.innerHTML = '';
      });
      document.getElementById('score-badge').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSidebar();
      selectActivity(0); // Khởi động nạp từ Activity 1
    });
  </script>
</body>
</html>
